<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividades — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  body { padding: 22px 14px 110px; max-width: 480px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--suave); font-size: 13px; margin: 4px 0 0; }
  button.sair { background: none; border: 1px solid var(--hairline); color: var(--suave); font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-jenc" aria-hidden="true"></div>
  <div class="fundo-jenc-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Atividades</h1>
      <p class="sub">Toca numa atividade para ver sala, capacidade e responsável.</p>
    </div>
    <button class="sair" onclick="terminarSessaoStaff()">Sair</button>
  </header>

  <div class="abas-dias" id="abas-dias"></div>
  <div id="area-calendario"></div>
  <div id="detalhe-atividade"></div>
  <div class="carregamento-agenda" id="carregamento">A carregar atividades…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="jenc-agenda.js"></script>
  <script>
    (async () => {
      const c = document.getElementById('carregamento');
      try {
        const user = await exigirSessaoStaff();
        if (!user) return;
        const staff = await getStaffAtual(user); // staff ou logística
        if (!staff) { c.textContent = 'Conta sem acesso de staff.'; return; }
        if (typeof JencAgenda === 'undefined') { c.textContent = 'Erro: o ficheiro jenc-agenda.js não foi encontrado (tem de estar na mesma pasta).'; return; }
        JencAgenda.montar({ detalhes: true });
      } catch (e) { console.error(e); c.textContent = 'Erro: ' + e.message; }
    })();

    async function terminarSessaoStaff() {
      await supabaseClient.auth.signOut();
      try { sessionStorage.clear(); } catch (e) {}
      window.location.href = 'login.html';
    }
  </script>

  <script src="jenc-ui.js"></script>
</body>
</html>
