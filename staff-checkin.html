<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  :root {
    --bg: #0C2340;
    --card: rgba(22, 55, 95, 0.46);
    --accent: #BD8C1C;
    --text: #F6F1E4;
    --muted: #93A6BF;
    --border: rgba(189, 140, 28, 0.24);
    --erro: #E8877A;
    --sucesso: #8FCB9B;
  }
  * { box-sizing: border-box; }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, [class*="campo"], input, .rotulo-funcao {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.015em; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  button.sair {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;
  }

  .aviso-camara {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: none;
  }

  #reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--card);
  }

  .entrada-manual {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .entrada-manual input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
  }
  .entrada-manual button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0C2340;
    font-weight: 600;
    cursor: pointer;
  }

  .mensagem { font-size: 13px; text-align: center; margin-bottom: 16px; min-height: 18px; }
  .mensagem.erro { color: var(--erro); }
  .mensagem.sucesso { color: var(--sucesso); }

  .passo { font-size: 12px; color: var(--muted); font-weight: 700; margin: 0 0 8px; letter-spacing: 0.3px; }
  .linha-tipo { display: flex; gap: 6px; margin-bottom: 10px; }
  .tipo-opcao {
    flex: 1; text-align: center; padding: 10px 6px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .tipo-opcao.ativo { background: var(--accent); color: #0C2340; border-color: var(--accent); font-weight: 700; }
  .tipo-opcao.acao-saida.ativo { background: var(--erro); border-color: var(--erro); color: #3a0b0b; }
  .estado-modo { font-size: 13px; text-align: center; margin: 4px 0 16px; color: var(--muted); }
  .estado-modo.pronto { color: var(--accent); font-weight: 600; }
  .bloqueado { opacity: 0.45; pointer-events: none; }

  .cartao-resultado {
    background: var(--card); border: 1px solid var(--border); border-left-width: 5px;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; display: none;
  }
  .cartao-resultado.ok { border-color: var(--sucesso); }
  .cartao-resultado.erro { border-color: var(--erro); }
  .cartao-resultado .estado-res { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .cartao-resultado.ok .estado-res { color: var(--sucesso); }
  .cartao-resultado.erro .estado-res { color: var(--erro); }
  .cartao-resultado .nome { font-size: 18px; font-weight: 700; }
  .cartao-resultado .junior { color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .selo-cargo { display: none; margin: 2px 0 10px; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 800;
    letter-spacing: .02em; background: rgba(255,200,60,.16); border: 1px solid #F2B84B; color: #F2B84B; text-align: center; }
  .linha-perfil {
    display: flex; justify-content: space-between; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--border); font-size: 13px;
  }
  .linha-perfil .rotulo { color: var(--muted); }
  .linha-perfil .valor { font-weight: 600; text-align: right; }
  .linha-perfil .valor.alerta { color: var(--erro); }

  .filtros { display: flex; gap: 8px; margin-bottom: 10px; }
  .filtros select, .filtros input {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; min-width: 0;
  }
  .filtros select { flex: 1; }
  .filtros input { flex: 1; }
  .filtros select:focus, .filtros input:focus { outline: none; border-color: var(--accent); }

  .cabecalho-lista { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 8px; font-size: 12px; color: var(--muted); }
  .lista-pendentes { max-height: 360px; overflow-y: auto; }
  .item-pendente {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .item-pendente .nome { font-weight: 600; }
  .item-pendente .detalhe { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .botao-registar-mini {
    flex-shrink: 0; padding: 7px 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #0C2340; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .tag-registado { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--sucesso); }

  .estado-carregamento { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .secao-extra { margin-top: 18px; }
  .botao-secao-extra {
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .painel-secao-extra { display: none; margin-top: 8px; }
  .painel-secao-extra.aberto { display: block; }
  .linha-recente {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .linha-recente .detalhe-recente { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .linha-recente .tag-acao { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-right: 6px; }
  .linha-recente .tag-acao.entrada { background: var(--sucesso); color: #08331a; }
  .linha-recente .tag-acao.saida { background: var(--erro); color: #3a0b0b; }
  .botao-anular {
    flex-shrink: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--erro);
    background: none; color: var(--erro); font-size: 11px; font-weight: 700; cursor: pointer;
  }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Check-in</h1>
      <p class="sub" id="saudacao-staff">A carregar…</p>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="staff-inicio.html" style="background:none; border:1px solid var(--border); color:var(--muted); font-size:14px; padding:6px 10px; border-radius:8px; text-decoration:none;" title="Início"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></a>
      <button class="sair" onclick="terminarSessaoStaff()">Sair</button>
    </div>
  </header>

  <p class="passo">1. ESCOLHE O TIPO DE CHECK-IN</p>
  <div class="linha-tipo" id="linha-tipo">
    <div class="tipo-opcao" data-tipo="evento" onclick="escolherTipo('evento')">Evento</div>
    <div class="tipo-opcao" data-tipo="alojamento" onclick="escolherTipo('alojamento')">Alojamento</div>
    <div class="tipo-opcao" data-tipo="almoco" onclick="escolherTipo('almoco')">Almoço</div>
    <div class="tipo-opcao" data-tipo="jantar" onclick="escolherTipo('jantar')">Jantar</div>
  </div>
  <div class="estado-modo" id="estado-modo">Escolhe o tipo de check-in para começar.</div>

  <div id="zona-leitura" class="bloqueado">
    <p class="passo">2. LÊ O QR CODE OU ESCREVE O CÓDIGO</p>
    <div id="aviso-camara" class="aviso-camara"></div>
    <div id="reader"></div>

    <div class="entrada-manual" style="margin-bottom:14px;">
      <input type="text" id="input-manual" placeholder="Ou escreve o código (ex: JENC-001)" autocomplete="off">
      <button onclick="registarManual()">Registar</button>
    </div>
  </div>

  <div class="mensagem" id="mensagem"></div>

  <div class="cartao-resultado" id="cartao-resultado">
    <div class="estado-res" id="res-estado">—</div>
    <div class="nome" id="res-nome">—</div>
    <div class="junior" id="res-junior">—</div>
    <div class="selo-cargo" id="res-cargo"></div>
    <div id="res-linhas"></div>
  </div>

  <p class="passo">PARTICIPANTES</p>
  <div class="linha-tipo" id="filtro-vista">
    <div class="tipo-opcao ativo" data-vista="pendentes" onclick="escolherVista('pendentes')">Por registar</div>
    <div class="tipo-opcao" data-vista="registados" onclick="escolherVista('registados')">Já registados</div>
  </div>
  <div class="filtros">
    <select id="filtro-junior" onchange="aoMudarFiltro()">
      <option value="">Todas as júnior empresas</option>
    </select>
    <input type="text" id="filtro-nome" placeholder="Procurar nome ou código…" oninput="renderLista()">
  </div>
  <div class="cabecalho-lista"><span id="contador-lista">—</span></div>
  <div class="lista-pendentes" id="lista-pendentes"></div>

  <div class="secao-extra">
    <button class="botao-secao-extra" onclick="alternarRecentes()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg> Correções recentes (anular um check-in) ▾</button>
    <div class="painel-secao-extra" id="painel-recentes"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script>
    const ROTULOS_TIPO = { evento: 'Evento', alojamento: 'Alojamento', almoco: 'Almoço', jantar: 'Jantar', refeicao: 'Refeição' };
    const SEM_JUNIOR = '__sem__';

    let staffAtual = null;
    let participantes = [];            // todos os participantes (carregados 1x)
    let porCodigo = new Map();         // QR (maiúsculas) -> participante
    let cargosMap = new Map();         // email (minúsculas) -> cargo (só quem NÃO é membro)
    let alojamentosMap = new Map();    // id -> nome
    let quartosMap = new Map();        // id -> numero
    let tipoSelecionado = null;        // só fica definido depois de o staff escolher
    const acaoSelecionada = 'entrada';   // só há entradas (a saída foi retirada)
    let vistaLista = 'pendentes';      // 'pendentes' | 'registados'
    let comEntrada = new Set();        // participante_id com entrada neste tipo
    let comSaida = new Set();          // participante_id com saída neste tipo
    let aProcessar = false;            // trava contra leituras repetidas
    let ultimoCodigo = null, ultimoCodigoEm = 0;

    init();

    function esc(t) {
      return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function init() {
      const user = await exigirSessaoStaff();
      if (!user) return;

      staffAtual = await getStaffAtual(user);
      if (!staffAtual) {
        document.getElementById('saudacao-staff').textContent = 'Conta sem acesso de staff.';
        return;
      }
      document.getElementById('saudacao-staff').textContent = `Olá, ${staffAtual.nome ?? 'staff'} `;

      await carregarBase();
      preencherFiltroJunior();
      renderLista();
      iniciarCamara();

    }

    async function carregarBase() {
      const [rp, ra, rq, rc] = await Promise.all([
        supabaseClient.from('participantes')
          .select('id, nome, email, qr_code, junior_empresa, universidade, restricoes_alimentares, alojamento, quarto_id, turno_refeicao')
          .order('nome', { ascending: true }),
        supabaseClient.from('alojamentos').select('id, nome'),
        supabaseClient.from('quartos').select('id, numero'),
        supabaseClient.from('cargos_participantes').select('email, cargo')
      ]);

      if (rp.error) {
        console.error('Erro ao ir buscar participantes:', rp.error.message);
        mostrarMensagem('Não foi possível carregar a lista de participantes.', 'erro');
      }
      participantes = rp.data ?? [];
      porCodigo = new Map(participantes.filter(p => p.qr_code).map(p => [p.qr_code.trim().toUpperCase(), p]));
      alojamentosMap = new Map((ra.data ?? []).map(a => [a.id, a.nome]));
      quartosMap = new Map((rq.data ?? []).map(q => [q.id, q.numero]));
      if (rc.error) console.error('Erro ao ir buscar cargos:', rc.error.message);
      cargosMap = new Map((rc.data ?? []).map(c => [String(c.email).trim().toLowerCase(), c.cargo]));
    }

    function preencherFiltroJunior() {
      const sel = document.getElementById('filtro-junior');
      const nomes = [...new Set(participantes.map(p => p.junior_empresa).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'pt'));
      nomes.forEach(n => {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        sel.appendChild(o);
      });
      if (participantes.some(p => !p.junior_empresa)) {
        const o = document.createElement('option');
        o.value = SEM_JUNIOR; o.textContent = 'Sem júnior empresa';
        sel.appendChild(o);
      }
    }

    // ------------------------------------------------------------
    // Escolha do tipo / ação (passo 1)
    // ------------------------------------------------------------
    async function escolherTipo(tipo) {
      tipoSelecionado = tipo;
      document.querySelectorAll('[data-tipo]').forEach(el => el.classList.toggle('ativo', el.dataset.tipo === tipo));
      atualizarEstadoModo();
      await carregarFeitos();
      renderLista();
    }

    function atualizarEstadoModo() {
      const el = document.getElementById('estado-modo');
      const zona = document.getElementById('zona-leitura');
      if (!tipoSelecionado) {
        el.textContent = 'Escolhe o tipo de check-in para começar.';
        el.className = 'estado-modo';
        zona.classList.add('bloqueado');
        return;
      }
      el.textContent = `A registar: ${ROTULOS_TIPO[tipoSelecionado]}`;
      el.className = 'estado-modo pronto';
      zona.classList.remove('bloqueado');
    }

    async function carregarFeitos() {
      comEntrada = new Set();
      comSaida = new Set();
      if (!tipoSelecionado) return;

      const { data, error } = await supabaseClient
        .from('checkins')
        .select('participante_id, acao')
        .eq('tipo', tipoSelecionado);

      if (error) {
        console.error('Erro ao ir buscar check-ins:', error.message, error.details, error.hint);
        mostrarMensagem('Não foi possível carregar os check-ins já feitos.', 'erro');
        return;
      }
      (data ?? []).forEach(c => (c.acao === 'entrada' ? comEntrada : comSaida).add(c.participante_id));
    }

    // ------------------------------------------------------------
    // Lista "Por registar" (+ filtro por júnior empresa)
    // ------------------------------------------------------------
    function passaFiltroJunior(p) {
      const f = document.getElementById('filtro-junior').value;
      if (!f) return true;
      return f === SEM_JUNIOR ? !p.junior_empresa : p.junior_empresa === f;
    }

    function escolherVista(vista) {
      vistaLista = vista;
      document.querySelectorAll('[data-vista]').forEach(el => el.classList.toggle('ativo', el.dataset.vista === vista));
      renderLista();
    }

    function aMudarFiltroRecentes() {
      if (document.getElementById('painel-recentes').classList.contains('aberto')) carregarRecentes();
    }
    function aoMudarFiltro() { renderLista(); aMudarFiltroRecentes(); }

    function renderLista() {
      const lista = document.getElementById('lista-pendentes');
      const contador = document.getElementById('contador-lista');
      const chipPend = document.querySelector('[data-vista="pendentes"]');
      const chipReg = document.querySelector('[data-vista="registados"]');
      lista.innerHTML = '';

      if (!tipoSelecionado) {
        contador.textContent = '';
        chipPend.textContent = 'Por registar';
        chipReg.textContent = 'Já registados';
        lista.innerHTML = '<div class="estado-carregamento" style="padding:20px 0;">Escolhe o tipo de check-in acima para veres quem falta.</div>';
        return;
      }

      const pesquisa = document.getElementById('filtro-nome').value.trim().toLowerCase();
      const doGrupo = participantes.filter(passaFiltroJunior);

      const registados = doGrupo.filter(p => comEntrada.has(p.id));
      const pendentes = doGrupo.filter(p => !comEntrada.has(p.id));

      chipPend.textContent = `Por registar (${pendentes.length})`;
      chipReg.textContent = `Já registados (${registados.length})`;
      contador.textContent = `${doGrupo.length} no total`;

      const base = vistaLista === 'registados' ? registados : pendentes;
      const visiveis = base.filter(p =>
        !pesquisa ||
        (p.nome ?? '').toLowerCase().includes(pesquisa) ||
        (p.qr_code ?? '').toLowerCase().includes(pesquisa)
      );

      if (visiveis.length === 0) {
        let msg = 'Ninguém encontrado com essa pesquisa.';
        if (base.length === 0) msg = vistaLista === 'registados' ? 'Ainda ninguém foi registado aqui.' : 'Ninguém por registar aqui. ';
        lista.innerHTML = `<div class="estado-carregamento" style="padding:20px 0;">${msg}</div>`;
        return;
      }

      visiveis.forEach(p => {
        const item = document.createElement('div');
        item.className = 'item-pendente';
        const acaoHtml = vistaLista === 'registados'
          ? '<span class="tag-registado">✓ Registado</span>'
          : '<button class="botao-registar-mini">Registar</button>';
        item.innerHTML = `
          <div>
            <div class="nome">${esc(p.nome)}</div>
            <div class="detalhe">${esc([p.qr_code, p.junior_empresa].filter(Boolean).join(' · '))}</div>
          </div>
          ${acaoHtml}
        `;
        const btn = item.querySelector('button');
        if (btn) btn.addEventListener('click', () => registarParticipante(p));
        lista.appendChild(item);
      });
    }

    // ------------------------------------------------------------
    // Câmara + código manual (passo 2) — registam logo, sem passo extra
    // ------------------------------------------------------------
    function iniciarCamara() {
      const aviso = document.getElementById('aviso-camara');

      if (location.protocol === 'file:') {
        aviso.style.display = 'block';
        aviso.textContent = 'A câmara não funciona a abrir o ficheiro diretamente (file://). Usa o campo manual, a lista abaixo, ou corre isto num servidor (https/localhost).';
        return;
      }

      try {
        const html5QrCode = new Html5Qrcode('reader');
        html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 240 },
          (codigoLido) => aoLerCodigo(codigoLido),
          () => {}
        ).catch(() => {
          aviso.style.display = 'block';
          aviso.textContent = 'Não foi possível aceder à câmara. Usa o campo manual ou a lista abaixo.';
        });
      } catch (e) {
        aviso.style.display = 'block';
        aviso.textContent = 'Não foi possível aceder à câmara. Usa o campo manual ou a lista abaixo.';
      }
    }

    function registarManual() {
      const codigo = document.getElementById('input-manual').value.trim();
      if (codigo) aoLerCodigo(codigo, true);
    }

    async function aoLerCodigo(codigoBruto, manual = false) {
      const codigo = String(codigoBruto).trim();
      if (!tipoSelecionado) {
        mostrarMensagem('Escolhe primeiro o tipo de check-in (passo 1).', 'erro');
        return;
      }
      if (aProcessar) return;

      // A câmara lê o mesmo QR várias vezes por segundo: ignora repetições seguidas.
      const agora = Date.now();
      if (!manual && codigo === ultimoCodigo && agora - ultimoCodigoEm < 4000) return;
      ultimoCodigo = codigo;
      ultimoCodigoEm = agora;

      let p = porCodigo.get(codigo.toUpperCase());
      if (!p) {
        // Pode ser alguém adicionado depois de a página abrir.
        const { data } = await supabaseClient.from('participantes')
          .select('id, nome, email, qr_code, junior_empresa, universidade, restricoes_alimentares, alojamento, quarto_id, turno_refeicao')
          .eq('qr_code', codigo).maybeSingle();
        if (data) { p = data; participantes.push(p); porCodigo.set(codigo.toUpperCase(), p); }
      }

      if (!p) {
        mostrarMensagem(`Código "${codigo}" não encontrado.`, 'erro');
        return;
      }

      const ok = await registarParticipante(p);
      if (ok && manual) document.getElementById('input-manual').value = '';
    }

    // ------------------------------------------------------------
    // Registo (uma única função usada pela câmara, pelo código e pela lista)
    // ------------------------------------------------------------
    async function registarParticipante(p) {
      if (!tipoSelecionado) {
        mostrarMensagem('Escolhe primeiro o tipo de check-in (passo 1).', 'erro');
        return false;
      }
      if (aProcessar) return false;
      aProcessar = true;

      const tipo = tipoSelecionado;
      const acao = acaoSelecionada;
      const rotulo = `${ROTULOS_TIPO[tipo]} · ${acao === 'entrada' ? 'Entrada' : 'Saída'}`;

      try {
        // Vê o estado REAL na base de dados (outro staff pode ter registado entretanto).
        const { data: existentes, error: erroLer } = await supabaseClient
          .from('checkins')
          .select('acao, criado_em')
          .eq('participante_id', p.id)
          .eq('tipo', tipo);

        if (erroLer) {
          mostrarMensagem('Erro ao verificar: ' + erroLer.message, 'erro');
          return false;
        }

        const jaEntrou = (existentes ?? []).find(c => c.acao === 'entrada');
        const jaSaiu = (existentes ?? []).find(c => c.acao === 'saida');

        if (acao === 'entrada' && jaEntrou) {
          comEntrada.add(p.id); renderLista();
          mostrarResultado(p, 'erro', `Já tem check-in (${rotulo}) às ${horaCurta(jaEntrou.criado_em)}`, tipo);
          return false;
        }
        if (acao === 'saida' && !jaEntrou) {
          mostrarResultado(p, 'erro', `Ainda não tem entrada (${ROTULOS_TIPO[tipo]}), por isso não pode ter saída`, tipo);
          return false;
        }
        if (acao === 'saida' && jaSaiu) {
          comSaida.add(p.id); renderLista();
          mostrarResultado(p, 'erro', `Já tem saída (${ROTULOS_TIPO[tipo]}) às ${horaCurta(jaSaiu.criado_em)}`, tipo);
          return false;
        }

        const { error } = await supabaseClient.from('checkins').insert({
          participante_id: p.id,
          // Se a tabela `checkins` só aceitar ids de staff em `lido_por`, a logística fica sem registo de quem leu.
          lido_por: staffAtual.tipo_conta === 'logistica' ? null : staffAtual.id,
          tipo,
          acao
        });

        if (error) {
          if (error.code === '23505') {
            mostrarResultado(p, 'erro', `Já tem este registo (${rotulo})`, tipo);
            await carregarFeitos(); renderLista();
          } else {
            console.error('Erro ao registar check-in:', error);
            mostrarMensagem('Erro ao registar: ' + error.message + (error.hint ? ' — ' + error.hint : ''), 'erro');
          }
          return false;
        }

        (acao === 'entrada' ? comEntrada : comSaida).add(p.id);
        mostrarMensagem('');
        mostrarResultado(p, 'ok', `✓ ${rotulo} registada`, tipo);
        renderLista(); // a pessoa desaparece da lista "Por registar"
        if (document.getElementById('painel-recentes').classList.contains('aberto')) carregarRecentes();
        return true;
      } finally {
        aProcessar = false;
      }
    }

    function horaCurta(iso) {
      return new Date(iso).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function mostrarResultado(p, estado, texto, tipo) {
      const cartao = document.getElementById('cartao-resultado');
      cartao.className = 'cartao-resultado ' + estado;
      document.getElementById('res-estado').textContent = texto;
      document.getElementById('res-nome').textContent = p.nome ?? '—';
      document.getElementById('res-junior').textContent = p.junior_empresa ?? '—';

      // Só o staff vê isto. Membros não têm entrada na tabela, por isso não aparece nada.
      const cargo = cargosMap.get(String(p.email ?? '').trim().toLowerCase());
      const seloCargo = document.getElementById('res-cargo');
      seloCargo.textContent = cargo ?? '';
      seloCargo.style.display = cargo ? 'block' : 'none';

      const linhas = [];
      const restr = p.restricoes_alimentares && p.restricoes_alimentares !== 'Nenhuma' ? p.restricoes_alimentares : null;
      if (tipo === 'almoco' || tipo === 'jantar' || tipo === 'refeicao') {
        linhas.push(['Restrições alimentares', restr ?? 'Nenhuma', !!restr]);
        linhas.push(['Turno refeição', p.turno_refeicao ?? 'Não atribuído', false]);
      } else if (tipo === 'alojamento') {
        linhas.push(['Alojamento', p.alojamento ? (alojamentosMap.get(p.alojamento) ?? '—') : 'Não atribuído', false]);
        linhas.push(['Quarto', p.quarto_id ? (quartosMap.get(p.quarto_id) ?? '—') : 'Não atribuído', false]);
      } else {
        linhas.push(['Universidade', p.universidade ?? '—', false]);
        if (restr) linhas.push(['Restrições alimentares', restr, true]);
      }

      document.getElementById('res-linhas').innerHTML = linhas.map(([r, v, alerta]) =>
        `<div class="linha-perfil"><span class="rotulo">${esc(r)}</span><span class="valor${alerta ? ' alerta' : ''}">${esc(v)}</span></div>`
      ).join('');
      cartao.style.display = 'block';
    }

    // ------------------------------------------------------------
    // Correções recentes (anular) — respeita o filtro de júnior empresa
    // ------------------------------------------------------------
    function alternarRecentes() {
      const painel = document.getElementById('painel-recentes');
      const abrir = !painel.classList.contains('aberto');
      painel.classList.toggle('aberto', abrir);
      if (abrir) carregarRecentes();
    }

    async function carregarRecentes() {
      const painel = document.getElementById('painel-recentes');
      painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">A carregar…</div>';

      const filtro = document.getElementById('filtro-junior').value;
      let query = supabaseClient
        .from('checkins')
        .select(`id, tipo, acao, criado_em, participantes${filtro ? '!inner' : ''}(nome, junior_empresa)`)
        .order('criado_em', { ascending: false })
        .limit(15);

      if (filtro && filtro !== SEM_JUNIOR) query = query.eq('participantes.junior_empresa', filtro);
      if (filtro === SEM_JUNIOR) query = query.is('participantes.junior_empresa', null);

      const { data, error } = await query;

      if (error) {
        painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">Não foi possível carregar.</div>';
        console.error('Erro ao ir buscar check-ins recentes:', error.message, error.details, error.hint);
        return;
      }
      if (!data || data.length === 0) {
        painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">Ainda não há check-ins registados.</div>';
        return;
      }

      painel.innerHTML = '';
      data.forEach(c => {
        const linha = document.createElement('div');
        linha.className = 'linha-recente';
        linha.innerHTML = `
          <div>
            <div><span class="tag-acao ${c.acao}">${c.acao === 'entrada' ? 'Entrada' : 'Saída'}</span>${esc(c.participantes?.nome ?? 'Participante removido')}</div>
            <div class="detalhe-recente">${esc(ROTULOS_TIPO[c.tipo] ?? c.tipo)} · ${horaCurta(c.criado_em)}</div>
          </div>
          <button class="botao-anular">Anular</button>
        `;
        linha.querySelector('button').addEventListener('click', () => anularCheckin(c.id));
        painel.appendChild(linha);
      });
    }

    async function anularCheckin(checkinId) {
      if (!confirm('Anular este check-in?')) return;
      const { error } = await supabaseClient.from('checkins').delete().eq('id', checkinId);
      if (error) {
        mostrarMensagem('Erro ao anular: ' + error.message, 'erro');
        return;
      }
      mostrarMensagem('Check-in anulado.', 'sucesso');
      await carregarRecentes();
      await carregarFeitos();   // a pessoa volta à lista "Por registar"
      renderLista();
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem' + (tipo ? ' ' + tipo : '');
    }

    async function terminarSessaoStaff() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

  <script src="jenc-ui.js"></script>
