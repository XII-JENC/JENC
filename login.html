<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0C2340;--gold:#BD8C1C;--gold-claro:#E8C873;--ivory:#F6F1E4;--mist:#A9BAD0;--erro:#E8877A;--sucesso:#8FCB9B;--hairline:rgba(189,140,28,.5)}
  *{box-sizing:border-box}
  html{background:#0C2340}
  body{margin:0;font-family:'Montserrat','Segoe UI',system-ui,sans-serif;background:transparent;color:var(--ivory)}
  .fundo-jenc{position:fixed;inset:0;z-index:-2;background:#0C2340 url("jenc-fundo.png") center top/cover no-repeat}
  .fundo-jenc-veu{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,35,64,.1),rgba(12,35,64,.3))}
  .campo-linha{margin-bottom:16px}
  .campo-linha label{display:block;font-size:12px;font-weight:600;color:var(--mist);margin-bottom:6px}
  .campo-linha input{width:100%;padding:14px 16px;font:500 15px Montserrat,sans-serif;color:var(--ivory);background:rgba(12,35,64,.55);border:1px solid var(--hairline);border-radius:14px}
  .campo-linha input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(189,140,28,.18)}
  .botao-dourado{width:100%;padding:15px;margin-top:6px;border:0;border-radius:12px;background:linear-gradient(135deg,#C4931F,#E8C873);color:var(--navy);font:700 15px Montserrat,sans-serif;cursor:pointer}
  .botao-dourado:disabled{opacity:.6}
</style>
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .caixa {
    width: 100%;
    max-width: 380px;
  }

  .logo-wrap {
    text-align: center;
    margin-bottom: 34px;
  }
  .logo-wrap img { width: 168px; height: auto; }
  .logo-wrap .flourish {
    width: 46px;
    height: auto;
    opacity: 0.85;
    margin-top: 18px;
  }

  h1.titulo-forma { font-size: 20px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  .sub {
    color: var(--mist);
    font-size: 13.5px;
    margin: 0 0 32px;
    text-align: center;
  }

  .mensagem { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
  .mensagem.erro { color: var(--erro); }
  .mensagem.sucesso { color: var(--sucesso); }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
<style>.botao-dourado{border-radius:999px}h1.titulo-forma{font-size:18px;margin:0}.caixa{padding:26px 22px;border-radius:24px;background:rgba(22,55,95,.6);border:1px solid rgba(189,140,28,.5);box-shadow:0 12px 34px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.logo-wrap{margin-bottom:22px!important}.logo-wrap img{width:150px!important;filter:brightness(0) invert(1)}.sub{margin-bottom:24px!important}</style>
</head>
<body>

  <div class="fundo-jenc" aria-hidden="true"></div>
  <div class="fundo-jenc-veu" aria-hidden="true"></div>

  <div class="caixa">
    <div class="logo-wrap">
      <img src="jenc-logo-azul.png" alt="XII JENC — Junior Entrepreneurs National Congress 2026">
    </div>

    <div style="text-align:center;margin-bottom:8px;"><h1 class="titulo-forma">Entra na tua conta</h1></div>
    <p class="sub">Participante ou equipa — usa o email que recebeste.</p>

    <div class="campo-linha">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@exemplo.com" autocomplete="email">
    </div>

    <div class="campo-linha">
      <label for="password">Palavra-passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="botao-dourado" id="botao-principal" onclick="entrar()">Entrar</button>

    <div class="mensagem" id="mensagem"></div>
  </div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    // Se já houver sessão ativa, descobre o tipo de conta e salta logo
    // para a página certa (participante ou staff).
    verificarSessaoExistente();
    async function verificarSessaoExistente() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) await redirecionarConformeTipo(session.user);
    }

    async function entrar() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const botao = document.getElementById('botao-principal');

      if (!email || !password) {
        mostrarMensagem('Preenche o email e a palavra-passe.', 'erro');
        return;
      }

      botao.disabled = true;
      mostrarMensagem('A processar…');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        mostrarMensagem(traduzirErro(error), 'erro');
        botao.disabled = false;
        return;
      }

      const encontrouConta = await redirecionarConformeTipo(data.user);
      if (!encontrouConta) {
        mostrarMensagem('Esta conta não está associada a nenhum participante nem membro de staff. Contacta a organização.', 'erro');
        await supabaseClient.auth.signOut();
        botao.disabled = false;
      }
    }

    // Verifica se o utilizador tem linha em `staff`, `logistica` ou
    // `participantes` e redireciona para a página correspondente.
    // Devolve false se não encontrar nenhuma (conta sem acesso).
    async function redirecionarConformeTipo(user) {
      const { data: staff } = await supabaseClient
        .from('staff')
        .select('id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (staff) {
        window.location.href = 'staff-inicio.html';
        return true;
      }

      const { data: logistica } = await supabaseClient
        .from('logistica')
        .select('id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (logistica) {
        window.location.href = 'logistica-inicio.html';
        return true;
      }

      const { data: participante } = await supabaseClient
        .from('participantes')
        .select('id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (participante) {
        window.location.href = 'inicio.html';
        return true;
      }

      return false;
    }

    function traduzirErro(error) {
      const msg = error.message || '';
      if (msg.includes('Invalid login credentials')) return 'Email ou palavra-passe incorretos.';
      return 'Ocorreu um erro: ' + msg;
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem' + (tipo ? ' ' + tipo : '');
    }
  </script>

  <script src="jenc-ui.js"></script>

</body>
</html>
