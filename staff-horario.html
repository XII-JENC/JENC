<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Meu Horário — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  :root {
    --bg: #0C2340;
    --card: rgba(22, 55, 95, 0.46);
    --accent: #BD8C1C;
    --text: #F6F1E4;
    --muted: #93A6BF;
    --border: rgba(189, 140, 28, 0.24);
  }
  * { box-sizing: border-box; }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, [class*="campo"], input, .rotulo-funcao {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.015em; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .nav-staff { display: flex; gap: 8px; }
  .nav-staff a, .nav-staff button {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:14px; padding:6px 10px; border-radius:8px; cursor:pointer; text-decoration:none;
  }

  .abas-vista { display: flex; gap: 8px; margin-bottom: 20px; }
  .aba-vista {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .aba-vista.ativa { background: var(--accent); color: #0C2340; border-color: var(--accent); }

  .rotulo-dia {
    font-size: 12px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }
  .rotulo-dia:first-child { margin-top: 0; }

  .card-turno {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
  }
  .card-turno .hora {
    font-weight: 700; font-size: 13px; color: var(--accent);
    width: 90px; flex-shrink: 0; line-height: 1.4;
  }
  .card-turno .info .titulo { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .card-turno .info .local { font-size: 12px; color: var(--muted); }
  .card-turno .info .funcao {
    display: inline-block; margin-top: 6px;
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: #BD8C1C20; padding: 2px 8px; border-radius: 999px;
  }
  .card-turno .info .quem { font-size: 12px; font-weight: 700; margin-top: 6px; }

  .vazio, .estado-carregamento { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>O Meu Horário</h1>
      <p class="sub" id="saudacao-staff">A carregar…</p>
    </div>
    <div class="nav-staff">
      <a href="staff-inicio.html" title="Início"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></a>
      <button onclick="terminarSessaoStaff()">Sair</button>
    </div>
  </header>

  <div class="abas-vista">
    <div class="aba-vista ativa" data-vista="minha">O meu horário</div>
    <div class="aba-vista" data-vista="equipa">Equipa toda</div>
  </div>

  <div id="lista-horario"></div>

  <div class="estado-carregamento" id="carregamento">A carregar horário…</div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    function hojeISO() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    let staffAtual = null;
    let vistaAtual = 'minha';

    init();

    document.querySelectorAll('.aba-vista').forEach(aba => {
      aba.addEventListener('click', () => {
        document.querySelectorAll('.aba-vista').forEach(a => a.classList.remove('ativa'));
        aba.classList.add('ativa');
        vistaAtual = aba.dataset.vista;
        carregarHorario();
      });
    });

    async function init() {
      const user = await exigirSessaoStaff();
      if (!user) return;

      staffAtual = await getStaffAtual(user);
      if (!staffAtual) {
        document.getElementById('carregamento').textContent = 'Conta sem acesso de staff.';
        return;
      }

      document.getElementById('saudacao-staff').textContent = `Olá, ${staffAtual.nome ?? 'staff'} `;

      // A logística não tem turnos próprios: abre logo na vista da equipa toda.
      if (staffAtual.tipo_conta === 'logistica') {
        vistaAtual = 'equipa';
        document.querySelectorAll('.aba-vista').forEach(a => a.classList.toggle('ativa', a.dataset.vista === 'equipa'));
      }
      await carregarHorario();
    }

    async function carregarHorario() {
      document.getElementById('carregamento').style.display = 'block';
      document.getElementById('carregamento').textContent = 'A carregar horário…';
      document.getElementById('lista-horario').innerHTML = '';

      const turnos = vistaAtual === 'minha'
        ? await getMeuHorario()
        : await getHorarioEquipa();

      renderHorario(turnos);
      document.getElementById('carregamento').style.display = 'none';
    }

    async function getMeuHorario() {
      const { data, error } = await supabaseClient
        .from('horario')
        .select(`
          id, titulo, funcao_no_turno, local, data, hora_inicio, hora_fim,
          atividades ( nome, local, data, hora_inicio, hora_fim )
        `)
        .eq('staff_id', staffAtual.id);

      if (error) {
        console.error('Erro ao ir buscar o teu horário:', error.message, error.details, error.hint);
        return [];
      }

      return (data ?? []).map(e => ({
        titulo: e.titulo ?? e.atividades?.nome ?? 'Turno',
        funcao_no_turno: e.funcao_no_turno,
        local: e.local ?? e.atividades?.local ?? null,
        data: e.data ?? e.atividades?.data ?? null,
        hora_inicio: e.hora_inicio ?? e.atividades?.hora_inicio ?? null,
        hora_fim: e.hora_fim ?? e.atividades?.hora_fim ?? null,
        nome_staff: null // não precisa de mostrar o próprio nome na vista pessoal
      })).sort(ordenarPorDataHora);
    }

    async function getHorarioEquipa() {
      const { data, error } = await supabaseClient.rpc('horario_equipa');
      if (error) {
        console.error('Erro ao ir buscar o horário da equipa:', error.message, error.details, error.hint);
        return [];
      }

      return (data ?? []).map(e => ({
        titulo: e.titulo ?? 'Turno',
        funcao_no_turno: e.funcao_no_turno,
        local: e.local,
        data: e.data,
        hora_inicio: e.hora_inicio,
        hora_fim: e.hora_fim,
        nome_staff: e.nome_staff
      })).sort(ordenarPorDataHora);
    }

    function ordenarPorDataHora(a, b) {
      const chaveA = `${a.data ?? ''}T${a.hora_inicio ?? ''}`;
      const chaveB = `${b.data ?? ''}T${b.hora_inicio ?? ''}`;
      return chaveA.localeCompare(chaveB);
    }

    function formatarData(dataISO) {
      if (!dataISO) return 'Sem data definida';
      const hoje = hojeISO();
      const d = new Date(dataISO + 'T00:00:00');
      const rotulo = d.toLocaleDateString('pt-PT', { weekday: 'long', day: '2-digit', month: 'long' });
      return dataISO === hoje ? `Hoje — ${rotulo}` : rotulo;
    }

    function renderHorario(turnos) {
      const container = document.getElementById('lista-horario');
      container.innerHTML = '';

      if (turnos.length === 0) {
        container.innerHTML = `<div class="vazio">${vistaAtual === 'minha' ? 'Ainda não tens turnos atribuídos.' : 'Ainda não há turnos publicados.'}</div>`;
        return;
      }

      let ultimaData = null;

      turnos.forEach(t => {
        if (t.data !== ultimaData) {
          const rotulo = document.createElement('div');
          rotulo.className = 'rotulo-dia';
          rotulo.textContent = formatarData(t.data);
          container.appendChild(rotulo);
          ultimaData = t.data;
        }

        const card = document.createElement('div');
        card.className = 'card-turno';
        card.innerHTML = `
          <div class="hora">${t.hora_inicio?.slice(0,5) ?? '--:--'}${t.hora_fim ? '<br>' + t.hora_fim.slice(0,5) : ''}</div>
          <div class="info">
            <div class="titulo">${t.titulo}</div>
            ${t.local ? `<div class="local"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.3" r="2.3"/></svg> ${t.local}</div>` : ''}
            ${t.nome_staff ? `<div class="quem"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="3.3"/><path d="M5 20c.9-4 3.6-6.2 7-6.2s6.1 2.2 7 6.2"/></svg> ${t.nome_staff}</div>` : ''}
            ${t.funcao_no_turno ? `<div class="funcao">${t.funcao_no_turno}</div>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function terminarSessaoStaff() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

  <script src="jenc-ui.js"></script>

</body>
</html>
