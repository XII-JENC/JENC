<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras & Budget — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  :root {
    --bg: #0C2340;
    --card: rgba(22, 55, 95, 0.46);
    --accent: #BD8C1C;
    --text: #F6F1E4;
    --muted: #93A6BF;
    --border: rgba(189, 140, 28, 0.24);
    --erro: #E8877A;
    --sucesso: #8FCB9B;
  }
  * { box-sizing: border-box; }
  .card, [class*="card"], [class*="cartao"], [class*="caixa"], input {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.015em; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 100px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .nav-topo { display: flex; gap: 8px; }
  .nav-topo a, .nav-topo button {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:14px; padding:6px 10px; border-radius:8px; cursor:pointer; text-decoration:none;
  }

  /* ---------- Orçamento (topo) ---------- */
  .cartao-resumo {
    background: linear-gradient(135deg, var(--accent), #E8C873);
    border-radius: 16px; padding: 20px; color: #0C2340; margin-bottom: 22px;
  }
  .cartao-resumo .tag { font-size: 12px; font-weight: 600; opacity: 0.75; }
  .cartao-resumo .numero { font-size: 30px; font-weight: 800; margin: 4px 0 2px; }
  .cartao-resumo .legenda { font-size: 13px; opacity: 0.85; }
  .barra-orc { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.15); margin-top: 12px; overflow: hidden; }
  .barra-orc > div { height: 100%; background: #0C2340; border-radius: 999px; }
  .barra-orc.passou > div { background: #B3261E; }
  .link-editar {
    background: none; border: none; padding: 0; margin-top: 10px; cursor: pointer;
    font-size: 12px; font-weight: 700; color: #0C2340; text-decoration: underline;
  }

  /* ---------- Formulários inline ---------- */
  .form-inline {
    display: none; margin-top: 10px; padding: 12px; border-radius: 10px;
    background: rgba(12,35,64,0.55); border: 1px solid var(--border);
  }
  .form-inline.aberto { display: block; }
  .form-inline label, .bloco-compra label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
  .form-inline label:first-child, .bloco-compra label:first-child { margin-top: 0; }
  .form-inline input, .bloco-compra input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .form-inline input:focus, .bloco-compra input:focus { outline: none; border-color: var(--accent); }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acoes-form { display: flex; gap: 8px; margin-top: 12px; }
  .acoes-form button {
    flex: 1; padding: 11px; border-radius: 8px; border: 1px solid var(--border);
    background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .acoes-form button.guardar { background: var(--accent); border-color: var(--accent); color: #0C2340; font-weight: 700; }
  .acoes-form button.apagar { color: var(--erro); border-color: var(--erro); flex: 0 0 auto; }

  /* ---------- Vista 1: caixas dos momentos ---------- */
  .caixa-nova {
    width: 100%; padding: 14px; border-radius: 14px; border: 1px dashed var(--accent);
    background: none; color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .rotulo-dia {
    font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 22px 0 10px;
  }
  .grelha-momentos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-momento {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 16px; color: var(--text); cursor: pointer; display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .card-momento.completo { border-color: var(--sucesso); }
  .card-momento .icone { font-size: 24px; margin-bottom: 10px; display: block; }
  .card-momento .titulo { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .card-momento .descricao { font-size: 12px; color: var(--muted); line-height: 1.4; min-height: 17px; }
  .card-momento .progresso-txt { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 12px; }
  .card-momento.completo .progresso-txt { color: var(--sucesso); }
  .mini-barra { height: 5px; border-radius: 999px; background: #1F3B57; margin-top: 6px; overflow: hidden; }
  .mini-barra > div { height: 100%; background: var(--accent); border-radius: 999px; }
  .card-momento.completo .mini-barra > div { background: var(--sucesso); }

  /* ---------- Vista 2: detalhe do momento ---------- */
  .voltar-momentos {
    background: none; border: none; padding: 0; margin-bottom: 14px; cursor: pointer;
    color: var(--muted); font-size: 13px; font-family: inherit;
  }
  .titulo-detalhe { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; }
  .info-momento { font-size: 13px; color: var(--muted); margin: 4px 0 16px; }

  .resumo-momento {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 8px;
  }
  .resumo-momento .linha { display: flex; justify-content: space-between; font-size: 13px; }
  .resumo-momento .linha span { color: var(--muted); }
  .resumo-momento .linha strong { color: var(--accent); }
  .resumo-momento .linha + .linha { margin-top: 8px; }
  .barra { height: 6px; border-radius: 999px; background: #1F3B57; margin: 10px 0 12px; overflow: hidden; }
  .barra > div { height: 100%; background: var(--accent); border-radius: 999px; }
  .barra > div.completo { background: var(--sucesso); }

  .rotulo-lista {
    font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 22px 0 8px;
  }

  /* Checklist */
  .linha-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .linha-item.comprado { border-color: rgba(124,217,146,0.35); }
  .linha-topo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .check {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: transparent; position: relative;
  }
  .check::before { content: ''; position: absolute; inset: -10px; } /* área de toque maior */
  .linha-item.pendente .check, .linha-item.comprado .check { cursor: pointer; }
  .linha-item.comprado .check { background: var(--sucesso); border-color: var(--sucesso); color: #08331a; }
  .corpo { flex: 1; min-width: 0; }
  .corpo .nome { font-size: 14px; font-weight: 600; }
  .linha-item.comprado .corpo .nome { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .corpo .sub-item { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .corpo .sub-item strong { color: var(--sucesso); }
  .corpo .mini-barra { margin-top: 7px; }
  .direita { text-align: right; flex-shrink: 0; font-size: 13px; font-weight: 800; color: var(--accent); }
  .direita small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 1px; }
  .linha-item.comprado .direita { color: var(--sucesso); }

  .painel-item { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .painel-item.aberto { display: block; }
  .sub-titulo { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin: 14px 0 6px; }
  .compra-linha {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 0; font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .compra-linha:last-of-type { border-bottom: none; }
  .compra-linha .txt { color: var(--text); line-height: 1.4; }
  .compra-linha .txt small { color: var(--muted); display: block; }
  .botao-anular {
    flex-shrink: 0; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--erro);
    background: none; color: var(--erro); font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .bloco-compra { padding: 12px; border-radius: 10px; background: rgba(12,35,64,0.55); border: 1px solid var(--border); }
  .link-editar-item {
    background: none; border: none; padding: 0; margin-top: 12px; cursor: pointer;
    font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: underline; font-family: inherit;
  }

  /* Caixas de ação (como as das páginas de início) */
  .grelha-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .caixa-acao {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 14px; color: var(--text); cursor: pointer; text-align: left; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .caixa-acao.destaque { border-color: var(--accent); }
  .caixa-acao.perigo { border-color: rgba(255,107,107,0.5); }
  .caixa-acao .icone { font-size: 22px; display: block; margin-bottom: 8px; }
  .caixa-acao .titulo { font-size: 13px; font-weight: 700; }
  .caixa-acao.perigo .titulo { color: var(--erro); }
  .caixa-acao .descricao { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

  .vazio, .estado { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60;
    max-width: 90%; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: #12283F; border: 1px solid var(--border); color: var(--text); display: none; text-align: center; cursor: pointer;
  }
  .toast.erro { border-color: var(--erro); color: var(--erro); }
  .toast.sucesso { border-color: var(--sucesso); color: var(--sucesso); }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Compras &amp; Budget</h1>
      <p class="sub">Coffee breaks, almoços e jantares.</p>
    </div>
    <div class="nav-topo">
      <a href="logistica-inicio.html" title="Início"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></a>
      <button onclick="terminarSessaoLogistica()">Sair</button>
    </div>
  </header>

  <div id="conteudo" style="display:none;">

    <!-- Orçamento do evento inteiro -->
    <div class="cartao-resumo">
      <div class="tag">ORÇAMENTO DISPONÍVEL</div>
      <div class="numero" id="res-restante">—</div>
      <div class="legenda" id="res-legenda">—</div>
      <div class="barra-orc" id="barra-orc"><div id="barra-orc-preenchida" style="width:0%"></div></div>
      <button class="link-editar" data-acao="abrir" data-alvo="form-orc">Editar orçamento total</button>
      <div class="form-inline" id="form-orc" style="background:rgba(255,255,255,0.35); border-color:rgba(0,0,0,0.15);">
        <label style="color:#0C2340;" for="orc-valor">Dinheiro total disponível para comida (€)</label>
        <input type="text" inputmode="decimal" id="orc-valor" min="0" step="0.01" placeholder="Ex: 1500" style="color:#0C2340; background:rgba(255,255,255,0.7);">
        <div class="acoes-form">
          <button class="guardar" data-acao="guardar-orc">Guardar</button>
          <button data-acao="fechar">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Vista 1: caixas dos momentos -->
    <div id="vista-momentos">
      <button class="caixa-nova" data-acao="abrir" data-alvo="form-momento">＋ Novo momento (coffee break, almoço, jantar…)</button>
      <div class="form-inline" id="form-momento">
        <label for="nm-nome">Nome do momento</label>
        <input type="text" id="nm-nome" placeholder="Ex: Coffee Break 3">
        <div class="linha2">
          <div><label for="nm-data">Data</label><input type="date" id="nm-data"></div>
          <div><label for="nm-local">Local</label><input type="text" id="nm-local" placeholder="Ex: Hall central"></div>
        </div>
        <div class="linha2">
          <div><label for="nm-inicio">Hora início</label><input type="time" id="nm-inicio"></div>
          <div><label for="nm-fim">Hora fim</label><input type="time" id="nm-fim"></div>
        </div>
        <div class="acoes-form">
          <button class="guardar" data-acao="criar-momento">Criar momento</button>
          <button data-acao="fechar">Cancelar</button>
        </div>
      </div>
      <div id="grelha-momentos"></div>
    </div>

    <!-- Vista 2: lista de um momento -->
    <div id="vista-detalhe" style="display:none;"></div>

  </div>

  <div class="estado" id="carregamento">A carregar…</div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <script>
    let momentos = [];
    let itens = [];
    let compras = [];
    let orcamento = 0;
    let momentoSelecionadoId = null; // null = vista das caixas; senão = lista desse momento
    const emCurso = new Set(); // ações a decorrer (por ação + id), para evitar toques duplos

    init();

    // ------------------------------------------------------------
    // Utilitários
    // ------------------------------------------------------------
    function esc(t) {
      return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function eur(n) {
      return (Number(n) || 0).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
    }
    function num(n) {
      const v = Number(n) || 0;
      return Number.isInteger(v) ? String(v) : v.toLocaleString('pt-PT', { maximumFractionDigits: 2 });
    }
    function hojeLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function formatarData(iso) {
      if (!iso) return '';
      return new Date(iso + 'T00:00:00').toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: 'short' });
    }
    let temporizadorToast = null;
    function toast(texto, tipo) {
      const el = document.getElementById('toast');
      el.textContent = texto;
      el.className = 'toast' + (tipo ? ' ' + tipo : '');
      el.style.display = 'block';
      el.onclick = () => { el.style.display = 'none'; };
      clearTimeout(temporizadorToast);
      // Os erros ficam no ecrã até tocares neles (para dar tempo de os ler); o resto desaparece sozinho.
      if (tipo !== 'erro') temporizadorToast = setTimeout(() => { el.style.display = 'none'; }, 3000);
      else el.textContent = texto + '  (toca para fechar)';
    }

    // ------------------------------------------------------------
    // Arranque (só a equipa de logística entra aqui)
    // ------------------------------------------------------------
    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: log, error } = await supabaseClient
        .from('logistica').select('id, nome').eq('user_id', session.user.id).maybeSingle();

      if (error || !log) {
        document.getElementById('carregamento').innerHTML =
          'Esta página é só para a equipa de logística. <a href="staff-inicio.html" style="color:var(--accent);">Voltar ao início</a>';
        return;
      }

      configurarEventos();
      const ok = await recarregar();
      if (!ok) return;

      document.getElementById('carregamento').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
    }

    async function recarregar() {
      const [rm, ri, rc, ro] = await Promise.all([
        supabaseClient.from('momentos_stock').select('id, nome, data, hora_inicio, hora_fim, local'),
        supabaseClient.from('itens_stock').select('id, momento_id, nome, quantidade_inicial, quantidade_necessaria, preco_unitario'),
        supabaseClient.from('compras_stock').select('id, item_id, quantidade, custo_total, loja, comprado_em, criado_em'),
        supabaseClient.from('orcamento_evento').select('valor_total').eq('id', 1).maybeSingle()
      ]);

      const erro = rm.error || ri.error || rc.error || ro.error;
      if (erro) {
        console.error('Erro ao carregar compras:', erro.message, erro.details, erro.hint);
        document.getElementById('carregamento').textContent =
          'Não foi possível carregar. Confirma que já correste o SQL das compras na Supabase. (' + erro.message + ')';
        document.getElementById('carregamento').style.display = 'block';
        return false;
      }

      momentos = (rm.data ?? []).sort((a, b) =>
        (a.data ?? '9999').localeCompare(b.data ?? '9999') ||
        (a.hora_inicio ?? '').localeCompare(b.hora_inicio ?? '') ||
        (a.nome ?? '').localeCompare(b.nome ?? '', 'pt', { numeric: true }));
      itens = (ri.data ?? []).sort((a, b) => (a.nome ?? '').localeCompare(b.nome ?? '', 'pt'));
      compras = rc.data ?? [];
      orcamento = Number(ro.data?.valor_total) || 0;

      if (momentoSelecionadoId && !momentos.some(m => m.id === momentoSelecionadoId)) momentoSelecionadoId = null;

      renderTudo();
      return true;
    }

    // ------------------------------------------------------------
    // Cálculos
    // ------------------------------------------------------------
    const itensDoMomento = (mid) => itens.filter(it => it.momento_id === mid);
    const comprasDoItem = (iid) => compras.filter(c => c.item_id === iid)
      .sort((a, b) => (b.comprado_em ?? '').localeCompare(a.comprado_em ?? '') || (b.criado_em ?? '').localeCompare(a.criado_em ?? ''));
    const gastoDoItem = (iid) => comprasDoItem(iid).reduce((s, c) => s + (Number(c.custo_total) || 0), 0);
    const faltaDoItem = (it) => Math.max(0, (Number(it.quantidade_necessaria) || 0) - (Number(it.quantidade_inicial) || 0));
    const estaCompleto = (it) => (Number(it.quantidade_necessaria) || 0) > 0 && faltaDoItem(it) === 0;
    const gastoTotal = () => compras.reduce((s, c) => s + (Number(c.custo_total) || 0), 0);

    function iconeMomento(m) {
      const n = (m.nome ?? '').toLowerCase();
      return (n.includes('almo') || n.includes('jant')) ? '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7M9 3v7M7 10a2 2 0 0 1-2-2V3M9 10v11M17 3c-2 0-3 2-3 4.5S16 12 17 12v9"/></svg>' : '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9ZM16 10h1.5a2 2 0 0 1 0 4H16M8 3v3M12 3v3"/></svg>';
    }
    function classeMomento(m) {
      const n = (m.nome ?? '').toLowerCase();
      return (n.includes('almo') || n.includes('jant')) ? ' refeicao' : ' coffee';
    }
    function horaELocal(m) {
      const partes = [];
      if (m.hora_inicio) partes.push(m.hora_inicio.slice(0, 5) + (m.hora_fim ? '–' + m.hora_fim.slice(0, 5) : ''));
      if (m.local) partes.push(m.local);
      return partes.join(' · ');
    }
    function cabecalhoMomento(m) {
      return [m.data ? formatarData(m.data) : '', horaELocal(m)].filter(Boolean).join(' · ');
    }

    // ------------------------------------------------------------
    // Renderização
    // ------------------------------------------------------------
    function renderTudo() {
      renderOrcamento();
      const emDetalhe = !!momentoSelecionadoId;
      document.getElementById('vista-momentos').style.display = emDetalhe ? 'none' : 'block';
      document.getElementById('vista-detalhe').style.display = emDetalhe ? 'block' : 'none';
      if (emDetalhe) renderDetalhe(); else renderGrelha();
    }

    function renderOrcamento() {
      const gasto = gastoTotal();
      const restante = orcamento - gasto;

      document.getElementById('res-restante').textContent = orcamento > 0 ? eur(restante) : '—';
      let legenda = orcamento > 0
        ? `${eur(gasto)} gastos de ${eur(orcamento)}`
        : `${eur(gasto)} gastos · define o orçamento total para veres quanto ainda tens.`;
      if (orcamento > 0 && gasto > orcamento) legenda += ` · acima do orçamento`;
      document.getElementById('res-legenda').textContent = legenda;

      const pct = orcamento > 0 ? Math.min(100, (gasto / orcamento) * 100) : 0;
      document.getElementById('barra-orc-preenchida').style.width = pct + '%';
      document.getElementById('barra-orc').classList.toggle('passou', orcamento > 0 && gasto > orcamento);
      document.getElementById('orc-valor').value = orcamento > 0 ? orcamento : '';
    }

    // ---- Vista 1: caixas por dia ----
    function renderGrelha() {
      const c = document.getElementById('grelha-momentos');
      if (momentos.length === 0) {
        c.innerHTML = '<div class="vazio">Ainda não há momentos.<br>Cria o primeiro acima (ex: Coffee Break 1).</div>';
        return;
      }

      const porDia = new Map();
      momentos.forEach(m => {
        const chave = m.data ?? '';
        if (!porDia.has(chave)) porDia.set(chave, []);
        porDia.get(chave).push(m);
      });

      let html = '';
      porDia.forEach((lista, dia) => {
        html += `<div class="rotulo-dia">${dia ? esc(formatarData(dia)) : 'Sem data definida'}</div><div class="grelha-momentos">`;
        lista.forEach(m => {
          const doMomento = itensDoMomento(m.id);
          const feitos = doMomento.filter(estaCompleto).length;
          const total = doMomento.length;
          const todos = total > 0 && feitos === total;
          const pct = total > 0 ? (feitos / total) * 100 : 0;
          html += `
            <div class="card-momento${todos ? ' completo' : ''}${classeMomento(m)}" role="button" tabindex="0" data-acao="abrir-momento" data-id="${esc(m.id)}">
              <span class="icone">${iconeMomento(m)}</span>
              <div class="titulo">${esc(m.nome)}</div>
              <div class="descricao">${esc(horaELocal(m))}</div>
              <div class="progresso-txt">${total === 0 ? 'Sem itens ainda' : (todos ? '✓ Tudo comprado' : `${feitos} de ${total} comprados`)}</div>
              ${total > 0 ? `<div class="mini-barra"><div style="width:${pct}%"></div></div>` : ''}
            </div>`;
        });
        html += '</div>';
      });
      c.innerHTML = html;
    }

    // ---- Vista 2: checklist do momento ----

      const comprados = doMomento.filter(estaCompleto);
      const gasto = doMomento.reduce((s, it) => s + gastoDoItem(it.id), 0);
      const pct = doMomento.length > 0 ? (comprados.length / doMomento.length) * 100 : 0;
      const mid = esc(m.id);

      c.innerHTML = `
        <button class="voltar-momentos" data-acao="voltar">← Todos os momentos</button>
        <div class="titulo-detalhe">${iconeMomento(m)} ${esc(m.nome)}</div>
        <div class="info-momento">${esc(cabecalhoMomento(m)) || 'Sem data definida'}</div>

        <div class="resumo-momento">
          <div class="linha"><span>Itens comprados</span><strong>${comprados.length} de ${doMomento.length}</strong></div>
          <div class="barra"><div class="${doMomento.length > 0 && comprados.length === doMomento.length ? 'completo' : ''}" style="width:${pct}%"></div></div>
          <div class="linha"><span>Gasto neste momento</span><strong>${eur(gasto)}</strong></div>
        </div>

        ${doMomento.length === 0 ? '<div class="vazio">Ainda não há itens neste momento.<br>Adiciona o primeiro em baixo.</div>' : ''}

        ${porComprar.length > 0 ? `
          <div class="rotulo-lista">Por comprar (${porComprar.length})</div>
          ${porComprar.map(renderLinhaPendente).join('')}` : ''}

        ${comprados.length > 0 ? `
          <div class="rotulo-lista">Comprado (${comprados.length})</div>
          ${comprados.map(renderLinhaComprada).join('')}` : ''}

        <div class="grelha-acoes">
          <button class="caixa-acao destaque" data-acao="abrir" data-alvo="novoitem-${mid}">
            <span class="icone"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><div class="titulo">Adicionar item</div><div class="descricao">Novo produto a comprar.</div>
          </button>
          <button class="caixa-acao" data-acao="copiar-momento" data-id="${mid}">
            <span class="icone"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></span><div class="titulo">Copiar lista</div><div class="descricao">O que falta comprar.</div>
          </button>
          <button class="caixa-acao" data-acao="abrir" data-alvo="editar-momento-${mid}">
            <span class="icone"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1ZM14 7l3 3"/></svg></span><div class="titulo">Editar momento</div><div class="descricao">Nome, hora e local.</div>
          </button>
          <button class="caixa-acao perigo" data-acao="apagar-momento" data-id="${mid}" data-itens="${doMomento.length}">
            <span class="icone"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></span><div class="titulo">Apagar momento</div><div class="descricao">Só se não tiver itens.</div>
          </button>

        <div class="form-inline" id="novoitem-${mid}">

          <input type="text" id="ni-nome-${mid}" placeholder="Ex: Café (kg), Água (garrafa)…">
          <div class="linha2">
            <div><label for="ni-nec-${mid}">Quantidade necessária</label><input type="text" inputmode="decimal" min="0" step="any" id="ni-nec-${mid}" placeholder="Ex: 200"></div>
            <div><label for="ni-preco-${mid}">Preço/un. (€) — opcional</label><input type="text" inputmode="decimal" min="0" step="0.01" id="ni-preco-${mid}" placeholder="Ex: 0.30"></div>
          </div>
          <div class="acoes-form">
            <button class="guardar" data-acao="criar-item" data-id="${mid}">Adicionar item</button>

          </div>
        </div>

        <div class="form-inline" id="editar-momento-${mid}">
          <label for="em-nome-${mid}">Nome</label>
          <input type="text" id="em-nome-${mid}" value="${esc(m.nome)}">

            <div><label for="em-local-${mid}">Local</label><input type="text" id="em-local-${mid}" value="${esc(m.local ?? '')}"></div>
          </div>
          <div class="linha2">
            <div><label for="em-inicio-${mid}">Hora início</label><input type="time" id="em-inicio-${mid}" value="${m.hora_inicio ?? ''}"></div>
            <div><label for="em-fim-${mid}">Hora fim</label><input type="time" id="em-fim-${mid}" value="${m.hora_fim ?? ''}"></div>
          </div>
          <div class="acoes-form">

    // Formulário de edição do item (partilhado pelas linhas pendentes e compradas)
    function renderEditarItem(it) {
      const id = esc(it.id);
      const nCompras = comprasDoItem(it.id).length;
      return `
        <button class="link-editar-item" data-acao="abrir" data-alvo="editar-${id}">Editar item</button>
        <div class="form-inline" id="editar-${id}">
          <label for="en-${id}">Nome</label>
          <input type="text" id="en-${id}" value="${esc(it.nome)}">
          <div class="linha2">
            <div><label for="ec-${id}">Quantidade necessária</label><input type="text" inputmode="decimal" min="0" step="any" id="ec-${id}" value="${Number(it.quantidade_necessaria) || 0}"></div>
            <div><label for="ep-${id}">Preço/un. (€)</label><input type="text" inputmode="decimal" min="0" step="0.01" id="ep-${id}" value="${Number(it.preco_unitario) || 0}"></div>
          </div>
          <div class="acoes-form">
            <button class="guardar" data-acao="guardar-item" data-id="${id}">Guardar</button>
            <button data-acao="fechar">Cancelar</button>
            <button class="apagar" data-acao="apagar-item" data-id="${id}" data-compras="${nCompras}">Apagar</button>
          </div>
        </div>`;
    }

    function renderComprasDoItem(it) {
      const lista = comprasDoItem(it.id);
      if (lista.length === 0) return '';
      return `
        <div class="sub-titulo">Compras registadas</div>
        ${lista.map(co => `
          <div class="compra-linha">
            <div class="txt">${num(co.quantidade)} comprados · ${eur(co.custo_total)}
              <small>${esc([formatarData(co.comprado_em), co.loja].filter(Boolean).join(' · '))}</small>
            </div>
            <button class="botao-anular" data-acao="anular-compra" data-id="${esc(co.id)}">Anular</button>
          </div>`).join('')}`;
    }

    function renderLinhaPendente(it) {
      const id = esc(it.id);
      const temos = Number(it.quantidade_inicial) || 0;
      const nec = Number(it.quantidade_necessaria) || 0;
      const preco = Number(it.preco_unitario) || 0;
      const falta = faltaDoItem(it);
      const pct = nec > 0 ? Math.min(100, (temos / nec) * 100) : 0;

      let sub;
      if (nec <= 0) sub = 'Sem quantidade definida — toca para editar';
      else if (temos > 0) sub = `Já comprámos <strong>${num(temos)}</strong> de ${num(nec)}`;
      else sub = `Precisamos de ${num(nec)}`;

      return `
        <div class="linha-item pendente">
          <div class="linha-topo" data-acao="alternar" data-alvo="painel-${id}">
            <div class="check" data-acao="check-rapido" data-id="${id}" title="Marcar como comprado"></div>
            <div class="corpo">
              <div class="nome">${esc(it.nome)}</div>
              <div class="sub-item">${sub}</div>
              ${temos > 0 && nec > 0 ? `<div class="mini-barra"><div style="width:${pct}%"></div></div>` : ''}
            </div>
            <div class="direita">${nec > 0 ? `Faltam ${num(falta)}` : '—'}${preco > 0 && nec > 0 ? `<small>~${eur(falta * preco)}</small>` : ''}</div>
          </div>
          <div class="painel-item" id="painel-${id}">
            ${renderComprasDoItem(it)}
            <div class="sub-titulo">Registar compra</div>
            <div class="bloco-compra">
              <div class="linha2">
                <div><label for="cq-${id}">Quantidade comprada</label><input type="text" inputmode="decimal" min="0" step="any" id="cq-${id}" value="${falta > 0 ? falta : ''}"></div>
                <div><label for="cc-${id}">Custo total (€)</label><input type="text" inputmode="decimal" min="0" step="0.01" id="cc-${id}" placeholder="${preco > 0 && falta > 0 ? (falta * preco).toFixed(2) : ''}"></div>
              </div>
              <label for="cl-${id}">Loja / nota (opcional)</label>
              <input type="text" id="cl-${id}" placeholder="Ex: Makro, fatura 123">
              <div class="acoes-form">
                <button class="guardar" data-acao="guardar-compra" data-id="${id}">✓ Registar compra</button>
              </div>
            </div>
            ${renderEditarItem(it)}
          </div>
        </div>`;
    }

    function renderLinhaComprada(it) {
      const id = esc(it.id);
      const temos = Number(it.quantidade_inicial) || 0;
      const gasto = gastoDoItem(it.id);
      const lojas = [...new Set(comprasDoItem(it.id).map(c => c.loja).filter(Boolean))].join(', ');

      return `
        <div class="linha-item comprado">
          <div class="linha-topo" data-acao="alternar" data-alvo="painel-${id}">
            <div class="check" data-acao="desmarcar" data-id="${id}" title="Desmarcar">✓</div>
            <div class="corpo">
              <div class="nome">${esc(it.nome)}</div>
              <div class="sub-item">${gasto > 0 ? eur(gasto) : (comprasDoItem(it.id).length === 0 ? 'sem compra registada' : 'sem custo registado')}${lojas ? ' · ' + esc(lojas) : ''}</div>
            </div>
            <div class="direita">${num(temos)}<small>comprados</small></div>
          </div>
          <div class="painel-item" id="painel-${id}">
            ${renderComprasDoItem(it)}
            ${renderEditarItem(it)}
          </div>
        </div>`;
    }

    // ------------------------------------------------------------
    // Eventos (delegação: um só listener para tudo)
    // ------------------------------------------------------------
    function configurarEventos() {
      document.getElementById('conteudo').addEventListener('click', async (e) => {
        const alvoEl = e.target.closest('[data-acao]');
        if (!alvoEl) return;
        const acao = alvoEl.dataset.acao;
        const id = alvoEl.dataset.id;

        if (acao === 'abrir-momento') { momentoSelecionadoId = id; renderTudo(); window.scrollTo({ top: 0 }); return; }
        if (acao === 'voltar') { momentoSelecionadoId = null; renderTudo(); window.scrollTo({ top: 0 }); return; }
        if (acao === 'alternar') { document.getElementById(alvoEl.dataset.alvo)?.classList.toggle('aberto'); return; }
        if (acao === 'abrir') {
          const alvo = document.getElementById(alvoEl.dataset.alvo);
          if (!alvo) return;
          alvo.classList.toggle('aberto');
          const primeiro = alvo.querySelector('input');
          if (alvo.classList.contains('aberto') && primeiro) primeiro.focus();
          return;
        }
        if (acao === 'fechar') { alvoEl.closest('.form-inline')?.classList.remove('aberto'); return; }

        const chave = acao + ':' + (id ?? '');
        if (emCurso.has(chave)) return; // duplo toque no mesmo botão
        emCurso.add(chave);
        alvoEl.disabled = true;
        try {
          if (acao === 'guardar-orc') await guardarOrcamento();
          else if (acao === 'criar-momento') await criarMomento();
          else if (acao === 'guardar-momento') await guardarMomento(id);
          else if (acao === 'apagar-momento') await apagarMomento(id, Number(alvoEl.dataset.itens) || 0);
          else if (acao === 'criar-item') await criarItem(id);
          else if (acao === 'guardar-item') await guardarItem(id);
          else if (acao === 'apagar-item') await apagarItem(id, Number(alvoEl.dataset.compras) || 0);
          else if (acao === 'guardar-compra') await registarCompra(id);
          else if (acao === 'check-rapido') await marcarCompradoRapido(id);
          else if (acao === 'desmarcar') await desmarcarComprado(id);
          else if (acao === 'anular-compra') await anularCompra(id);
          else if (acao === 'copiar-momento') await copiarListaMomento(id);
        } catch (err) {
          console.error('Erro inesperado na ação', acao, err);
          toast('Ocorreu um erro: ' + (err?.message ?? err), 'erro');
        } finally {
          emCurso.delete(chave);
          alvoEl.disabled = false;
        }
      });

      // Enter/Espaço nas caixas dos momentos (acessibilidade)
      document.getElementById('conteudo').addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.card-momento')) {
          e.preventDefault();
          e.target.click();
        }
      });
    }

    // ------------------------------------------------------------
    // Ações (escrevem na Supabase)
    // ------------------------------------------------------------
    async function guardarOrcamento() {
      const valor = parseFloat(document.getElementById('orc-valor').value);
      if (!(valor >= 0)) { toast('Indica um valor válido.', 'erro'); return; }
      const { error } = await supabaseClient.from('orcamento_evento').upsert({ id: 1, valor_total: valor });
      if (error) { toast('Erro ao guardar o orçamento: ' + error.message, 'erro'); return; }
      toast('Orçamento guardado.', 'sucesso');
      await recarregar();
    }

    async function criarMomento() {
      const nome = document.getElementById('nm-nome').value.trim();
      if (!nome) { toast('Dá um nome ao momento (ex: Coffee Break 1).', 'erro'); return; }
      const { data, error } = await supabaseClient.from('momentos_stock').insert({
        nome,
        data: document.getElementById('nm-data').value || null,
        hora_inicio: document.getElementById('nm-inicio').value || null,
        hora_fim: document.getElementById('nm-fim').value || null,
        local: document.getElementById('nm-local').value.trim() || null
      }).select('id').single();
      if (error) { toast('Erro ao criar momento: ' + error.message, 'erro'); return; }

      ['nm-nome', 'nm-data', 'nm-local', 'nm-inicio', 'nm-fim'].forEach(i => { document.getElementById(i).value = ''; });
      document.getElementById('form-momento').classList.remove('aberto');
      toast('Momento criado.', 'sucesso');
      momentoSelecionadoId = data?.id ?? null; // entra logo no momento novo para adicionares itens
      await recarregar();
      window.scrollTo({ top: 0 });
    }

    async function guardarMomento(id) {
      const nome = document.getElementById(`em-nome-${id}`).value.trim();
      if (!nome) { toast('O nome não pode ficar vazio.', 'erro'); return; }
      const { error } = await supabaseClient.from('momentos_stock').update({
        nome,
        data: document.getElementById(`em-data-${id}`).value || null,
        hora_inicio: document.getElementById(`em-inicio-${id}`).value || null,
        hora_fim: document.getElementById(`em-fim-${id}`).value || null,
        local: document.getElementById(`em-local-${id}`).value.trim() || null
      }).eq('id', id);
      if (error) { toast('Erro ao guardar: ' + error.message, 'erro'); return; }
      toast('Momento atualizado.', 'sucesso');
      await recarregar();
    }

    async function apagarMomento(id, nItens) {
      if (nItens > 0) {
        toast(`Este momento tem ${nItens} item(ns). Apaga-os primeiro (em "Editar item" → Apagar).`, 'erro');
        return;
      }
      if (!confirm('Apagar este momento?')) return;
      const { error } = await supabaseClient.from('momentos_stock').delete().eq('id', id);
      if (error) { toast('Erro ao apagar: ' + error.message, 'erro'); return; }
      toast('Momento apagado.', 'sucesso');
      momentoSelecionadoId = null;
      await recarregar();
      window.scrollTo({ top: 0 });
    }

    async function criarItem(momentoId) {
      const nome = document.getElementById(`ni-nome-${momentoId}`).value.trim();
      const nec = parseFloat(document.getElementById(`ni-nec-${momentoId}`).value) || 0;
      const preco = parseFloat(document.getElementById(`ni-preco-${momentoId}`).value) || 0;
      if (!nome) { toast('Dá um nome ao item (ex: Café).', 'erro'); return; }

      const { error } = await supabaseClient.from('itens_stock').insert({
        momento_id: momentoId,
        nome,
        quantidade_inicial: 0,     // ainda não comprámos nada: sobe quando registares compras
        quantidade_restante: 0,
        quantidade_necessaria: nec,
        preco_unitario: preco
      });
      if (error) { toast('Erro ao adicionar item: ' + error.message, 'erro'); return; }
      toast('Item adicionado.', 'sucesso');
      await recarregar();
    }

    async function guardarItem(id) {
      const nome = document.getElementById(`en-${id}`).value.trim();
      if (!nome) { toast('O nome não pode ficar vazio.', 'erro'); return; }
      const { error } = await supabaseClient.from('itens_stock').update({
        nome,
        quantidade_necessaria: parseFloat(document.getElementById(`ec-${id}`).value) || 0,
        preco_unitario: parseFloat(document.getElementById(`ep-${id}`).value) || 0
      }).eq('id', id);
      if (error) { toast('Erro ao guardar: ' + error.message, 'erro'); return; }
      toast('Item atualizado.', 'sucesso');
      await recarregar();
    }

    async function apagarItem(id, nCompras) {
      if (nCompras > 0) {
        toast(`Este item tem ${nCompras} compra(s) registada(s). Anula-as primeiro (em "Compras registadas").`, 'erro');
        return;
      }
      if (!confirm('Apagar este item?')) return;
      const { error } = await supabaseClient.from('itens_stock').delete().eq('id', id);
      if (error) { toast('Erro ao apagar: ' + error.message, 'erro'); return; }
      toast('Item apagado.', 'sucesso');
      await recarregar();
    }

    async function registarCompra(itemId) {
      const it = itens.find(i => i.id === itemId);
      const qtd = parseFloat(document.getElementById(`cq-${itemId}`).value);
      if (!(qtd > 0)) { toast('Indica a quantidade comprada.', 'erro'); return; }

      const custoTexto = document.getElementById(`cc-${itemId}`).value;
      let custo = parseFloat(custoTexto);
      if (custoTexto === '' || isNaN(custo)) custo = qtd * (Number(it?.preco_unitario) || 0); // sem valor: usa o preço estimado
      if (custo < 0) { toast('O custo não pode ser negativo.', 'erro'); return; }

      const { error } = await supabaseClient.rpc('registar_compra', {
        p_item_id: itemId,
        p_quantidade: qtd,
        p_custo_total: custo,
        p_loja: document.getElementById(`cl-${itemId}`).value.trim() || null,
        p_data: hojeLocal()
      });
      if (error) { toast('Erro ao registar compra: ' + error.message, 'erro'); return; }
      toast(`Compra registada: ${eur(custo)}.`, 'sucesso');
      await recarregar();
    }

    // Toque na bolinha: o item fica riscado logo (antes de a base de dados responder).
    // Regista a compra do que falta ao preço estimado (se não houver preço, o custo fica a 0 €
    // e o item mostra "sem custo registado"). Se a base de dados falhar, o item volta atrás.
    async function marcarCompradoRapido(itemId) {
      const it = itens.find(i => i.id === itemId);
      if (!it) return;
      const nec = Number(it.quantidade_necessaria) || 0;
      const falta = faltaDoItem(it);
      const preco = Number(it.preco_unitario) || 0;

      if (!(falta > 0)) {
        toast('Define primeiro a quantidade necessária (abre o item → Editar item).', 'erro');
        document.getElementById(`painel-${itemId}`)?.classList.add('aberto');
        return;
      }

      const custo = falta * preco;
      const antes = it.quantidade_inicial;
      it.quantidade_inicial = nec;   // feedback imediato
      renderTudo();

      const { error } = await supabaseClient.rpc('registar_compra', {
        p_item_id: itemId, p_quantidade: falta, p_custo_total: custo, p_loja: null, p_data: hojeLocal()
      });

      if (error) {
        console.error('Erro em registar_compra:', error);
        it.quantidade_inicial = antes; // desfaz
        renderTudo();
        toast(`Não foi possível marcar "${it.nome}" como comprado: ${error.message}`, 'erro');
        return;
      }

      toast(preco > 0
        ? `${it.nome}: comprado (${eur(custo)} estimado).`
        : `${it.nome}: comprado, mas sem custo (o item não tem preço). Abre-o para corrigir.`, preco > 0 ? 'sucesso' : undefined);
      await recarregar();
    }

    // Toque numa bolinha já marcada: tira o risco (anula as compras registadas desse item).
    async function desmarcarComprado(itemId) {
      const it = itens.find(i => i.id === itemId);
      if (!it) return;
      const lista = comprasDoItem(itemId);
      if (lista.length === 0) {
        document.getElementById(`painel-${itemId}`)?.classList.add('aberto');
        toast('Este item já está completo mas não tem nenhuma compra registada (a quantidade veio de outro sítio). Abre "Editar item" para ajustar a quantidade necessária.', 'erro');
        return;
      }
      const total = lista.reduce((s, c) => s + (Number(c.custo_total) || 0), 0);
      if (!confirm(`Desmarcar "${it.nome}"?\nVão ser anuladas ${lista.length} compra(s) (${eur(total)}) e o valor deixa de contar como gasto.`)) return;

      for (const c of lista) {
        const { error } = await supabaseClient.rpc('anular_compra', { p_compra_id: c.id });
        if (error) {
          console.error('Erro em anular_compra:', error);
          toast('Erro ao desmarcar: ' + error.message, 'erro');
          await recarregar();
          return;
        }
      }
      toast(`${it.nome}: voltou a "Por comprar".`, 'sucesso');
      await recarregar();
    }

    async function anularCompra(id) {
      if (!confirm('Anular esta compra? A quantidade sai do stock e o valor deixa de contar como gasto.')) return;
      const { error } = await supabaseClient.rpc('anular_compra', { p_compra_id: id });
      if (error) { toast('Erro ao anular: ' + error.message, 'erro'); return; }
      toast('Compra anulada.', 'sucesso');
      await recarregar();
    }

    async function copiarListaMomento(momentoId) {
      const m = momentos.find(x => x.id === momentoId);
      const pendentes = itensDoMomento(momentoId).filter(it => faltaDoItem(it) > 0);
      if (pendentes.length === 0) { toast('Não há nada por comprar neste momento.', 'erro'); return; }

      const linhas = pendentes.map(it => `- ${it.nome}: ${num(faltaDoItem(it))}`);
      const texto = `Lista de compras — ${m?.nome ?? ''}\n${linhas.join('\n')}`;
      try {
        await navigator.clipboard.writeText(texto);
        toast('Lista copiada.', 'sucesso');
      } catch (e) {
        prompt('Copia a lista:', texto);
      }
    }

    async function terminarSessaoLogistica() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

  <script src="jenc-ui.js"></script>
