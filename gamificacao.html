<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missões — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  :root {
    --bg: #0C2340;
    --card: rgba(22, 55, 95, 0.46);
    --accent: #BD8C1C;
    --text: #F6F1E4;
    --muted: #93A6BF;
    --border: rgba(189, 140, 28, 0.24);
    --sucesso: #8FCB9B;
    --erro: #E8877A;
  }
  * { box-sizing: border-box; }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, input {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.015em; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 480px;
    margin-inline: auto;
  }
  .voltar {
    display: inline-block;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; margin: 0 0 18px; }

  .cartao-pontos {
    background: linear-gradient(135deg, var(--accent), #E8C873);
    border-radius: 16px;
    padding: 20px;
    color: #0C2340;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cartao-pontos .tag { font-size: 12px; font-weight: 600; opacity: 0.75; }
  .cartao-pontos .numero { font-size: 30px; font-weight: 800; margin-top: 2px; }
  .cartao-pontos .posicao { text-align: right; font-size: 13px; font-weight: 700; }

  .abas-secao {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .aba-secao {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .aba-secao.ativa { background: var(--accent); color: #0C2340; border-color: var(--accent); }


  /* Painel de topo: título e separadores no mesmo bloco azul */
  .painel-topo { background: #123A5C; border-radius: 16px; padding: 18px 14px 14px; margin: 0 0 18px; box-shadow: 0 10px 26px rgba(12,35,64,.2); }
  .painel-topo h1 { color: #fff; font-size: 21px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.01em; }
  .painel-topo .abas-secao { display: flex; flex-wrap: nowrap; gap: 6px; margin: 0; overflow-x: auto; scrollbar-width: none; }
  .painel-topo .abas-secao::-webkit-scrollbar { display: none; }
  .painel-topo .aba-secao { flex: 1 1 auto; white-space: nowrap; text-align: center; padding: 9px 8px !important; border-radius: 10px !important; background: #fff !important; border: 0 !important; color: #123A5C !important; font-size: 12px; font-weight: 500; }
  .painel-topo .aba-secao.ativa { background: #D8B45F !important; color: #123A5C !important; font-weight: 700; }
  .painel-topo .aba-secao:not(.ativa):hover { background: #F1EBDA !important; }

  .secao { display: none; }
  .secao.ativa { display: block; }

  .card-desafio {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-desafio.em-breve { opacity: 0.6; }
  .cabecalho-desafio { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .cabecalho-desafio .nome { font-size: 15px; font-weight: 700; }
  .badge-pontos {
    flex-shrink: 0;
    font-size: 11px; font-weight: 700;
    background: #BD8C1C20; color: var(--accent);
    padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge-embreve {
    flex-shrink: 0;
    font-size: 11px; font-weight: 700;
    background: var(--border); color: var(--muted);
    padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .descricao-desafio { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }

  .estado-desafio {
    font-size: 13px; font-weight: 700; padding: 8px 0;
  }
  .estado-desafio.aprovado { color: var(--sucesso); }

  .form-submissao input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 13px; margin-bottom: 8px;
  }
  .form-submissao input[type="file"] {
    width: 100%; font-size: 12px; color: var(--muted); margin-bottom: 10px;
  }
  .form-submissao label.pergunta { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .form-submissao .dica-ideia { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .form-submissao textarea {
    width: 100%; min-height: 120px; padding: 12px 14px; border-radius: 12px; resize: vertical;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: 500 14px/1.5 Montserrat, 'Segoe UI', system-ui, sans-serif; margin-bottom: 6px;
  }
  .contador-ideia { text-align: right; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .contador-ideia.cheio { color: var(--erro); }
  .subtitulo-ideia { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .paragrafo-ideia { margin: 0; }
  .texto-ideia { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  .rodape-ideia { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .botao-apagar-ideia { padding: 6px 14px; font: 600 12px Montserrat, sans-serif; cursor: pointer; }
  .autor-ideia { font-size: 12px; font-weight: 700; }
  .autor-ideia span { color: var(--muted); font-weight: 500; }
  .botao-submeter {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #0C2340; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .botao-submeter:disabled { opacity: 0.6; cursor: default; }

  .miniatura-enviada {
    width: 100%; max-height: 220px; object-fit: cover;
    border-radius: 10px; margin-bottom: 8px;
  }

  .mensagem-desafio { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .mensagem-desafio.erro { color: var(--erro); }
  .mensagem-desafio.sucesso { color: var(--sucesso); }

  .grid-mural {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .item-mural {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .item-mural img { width: 100%; height: 130px; object-fit: cover; display: block; cursor: pointer; }
  .item-mural .legenda-mural { padding: 8px 10px; font-size: 11px; }
  .item-mural .legenda-mural .nome { font-weight: 700; }
  .item-mural .legenda-mural .texto { color: var(--muted); margin-top: 2px; }

  /* Visualizador de ecrã inteiro do mural */
  .lightbox-mural {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(6, 14, 26, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .lightbox-mural.aberto { display: flex; }
  .lightbox-mural img {
    max-width: 100%; max-height: 68vh;
    border-radius: 12px;
    object-fit: contain;
  }
  .lightbox-legenda { color: var(--text); font-size: 13px; text-align: center; margin-top: 14px; max-width: 320px; }
  .lightbox-legenda .nome { font-weight: 700; }
  .lightbox-legenda .texto { color: var(--muted); margin-top: 2px; }
  .lightbox-acoes { display: flex; gap: 10px; margin-top: 18px; }
  .lightbox-botao {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .lightbox-botao.principal { background: var(--accent); color: #0C2340; border-color: var(--accent); }
  .lightbox-botao svg { width: 16px; height: 16px; }
  .lightbox-fechar {
    position: absolute; top: 18px; right: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .lightbox-fechar svg { width: 16px; height: 16px; }

  .linha-leaderboard {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .linha-leaderboard.eu { border-color: var(--accent); background: #BD8C1C15; }
  .linha-leaderboard .posicao-num {
    width: 26px; text-align: center; font-weight: 800; color: var(--muted); font-size: 14px;
  }
  .linha-leaderboard.top1 .posicao-num,
  .linha-leaderboard.top2 .posicao-num,
  .linha-leaderboard.top3 .posicao-num { color: var(--accent); }
  .linha-leaderboard .info-lb { flex: 1; }
  .linha-leaderboard .nome-lb { font-size: 13px; font-weight: 600; }
  .linha-leaderboard .junior-lb { font-size: 11px; color: var(--muted); }
  .linha-leaderboard .pontos-lb { font-size: 14px; font-weight: 800; color: var(--accent); }

  .estado, .vazio { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header class="painel-topo">
    <h1>Missões</h1>
    <div class="abas-secao" role="tablist">
      <button type="button" role="tab" class="aba-secao ativa" data-secao="desafios">Desafios</button>
      <button type="button" role="tab" class="aba-secao" data-secao="mural">Share your JENC</button>
      <button type="button" role="tab" class="aba-secao" data-secao="ideias">One talk, one takeaway</button>
      <button type="button" role="tab" class="aba-secao" data-secao="leaderboard">Top navegantes</button>
    </div>
  </header>

  <div id="conteudo" style="display:none;">

    <div class="cartao-pontos">
      <div>
        <div class="tag">OS TEUS PONTOS</div>
        <div class="numero" id="total-pontos">0</div>
      </div>
      <div class="posicao" id="posicao-leaderboard">—</div>
    </div>

    <div class="secao ativa" id="secao-desafios"></div>

    <div class="secao" id="secao-mural">
      <div id="grid-mural" class="grid-mural"></div>
      <div class="vazio" id="mural-vazio" style="display:none;">Ainda não há fotos no Share your JENC. Sê o primeiro a partilhar!</div>
    </div>

    <div class="secao" id="secao-ideias"></div>

    <div class="secao" id="secao-leaderboard"></div>

  </div>

  <div class="estado" id="carregamento">A carregar…</div>

  <!-- Visualizador de ecrã inteiro do mural -->
  <div class="lightbox-mural" id="lightbox-mural">
    <button class="lightbox-fechar" onclick="fecharLightbox()" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-legenda">
      <div class="nome" id="lightbox-nome"></div>
      <div class="texto" id="lightbox-texto"></div>
    </div>
    <div class="lightbox-acoes">
      <button class="lightbox-botao principal" id="lightbox-download" onclick="descarregarFotoLightbox()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>
        Descarregar
      </button>
    </div>
  </div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    // Escapa texto escrito por outras pessoas antes de o pôr no HTML
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const MAX_IDEIA = 500; // ≈ 30 segundos de leitura
    // Título e texto do desafio das ideias: aparecem sempre, venha o que vier da base de dados
    const IDEIA_NOME = 'One talk, one takeaway';
    const IDEIA_SUBTITULO = 'Uma palestra. Uma ideia. Uma nova perspetiva.';
    const IDEIA_TEXTO = 'Ouve uma palestra no JENC e partilha uma ideia que te tenha marcado. Pode ser algo que aprendeste, uma pergunta que ficou ou uma perspetiva que mudou.';
    const IDEIA_DESC_HTML = `<div class="subtitulo-ideia">${IDEIA_SUBTITULO}</div><p class="paragrafo-ideia">${IDEIA_TEXTO}</p>`;

    let participanteAtual = null;
    let desafios = [];
    let minhasFotos = {};
    let minhasParticipacoes = {}; // { desafio_id: linha_da_gamification }

    init();

    let trocando = false;
    document.querySelectorAll('.aba-secao').forEach(aba => {
      aba.addEventListener('click', () => {
        if (trocando || aba.classList.contains('ativa')) return;
        trocando = true;

        document.querySelectorAll('.aba-secao').forEach(a => { a.classList.remove('ativa'); a.setAttribute('aria-selected', 'false'); });
        aba.classList.add('ativa');
        aba.setAttribute('aria-selected', 'true');

        // A secção atual esmorece, depois entra a nova (sem salto)
        const atual = document.querySelector('.secao.ativa');
        const proxima = document.getElementById('secao-' + aba.dataset.secao);
        if (atual) atual.classList.add('saindo');
        setTimeout(() => {
          if (atual) atual.classList.remove('ativa', 'saindo');
          proxima.classList.add('ativa');
          if (aba.dataset.secao === 'mural') carregarMural();
          if (aba.dataset.secao === 'ideias') carregarIdeias();
          if (aba.dataset.secao === 'leaderboard') carregarLeaderboard();
          trocando = false;
        }, atual ? 170 : 0);
      });
    });

    async function init() {
      const user = await exigirSessao();
      if (!user) return;

      participanteAtual = await getParticipanteAtual(user);
      if (!participanteAtual) {
        document.getElementById('carregamento').textContent =
          'Não foi possível carregar os teus dados. Contacta a organização.';
        return;
      }

      desafios = await getDesafios();
      await carregarMinhasParticipacoes();
      await carregarContagemContactos();
      renderDesafios();
      await carregarPontosEPosicao();

      document.getElementById('carregamento').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
    }

    async function getDesafios() {
      const { data, error } = await supabaseClient
        .from('desafios')
        .select('id, nome, descricao, pontos, tipo')
        .eq('ativo', true);

      if (error) {
        console.error('Erro ao ir buscar desafios:', error.message, error.details, error.hint);
        return [];
      }
      return data ?? [];
    }

    let contagemContactos = 0;

    async function carregarContagemContactos() {
      const { data, error } = await supabaseClient.rpc('meus_contactos');
      if (error) {
        console.error('Erro ao ir buscar contagem de contactos:', error.message, error.details, error.hint);
        return;
      }
      contagemContactos = data?.length ?? 0;
    }

    async function carregarMinhasParticipacoes() {
      const { data, error } = await supabaseClient
        .from('gamification')
        .select('id, desafio_id, pontos, estado, imagem_url, legenda')
        .eq('participante_id', participanteAtual.id);

      if (error) {
        console.error('Erro ao ir buscar as tuas participações:', error.message, error.details, error.hint);
        return;
      }

      minhasParticipacoes = {};
      minhasFotos = {};
      (data ?? []).forEach(l => {
        const atual = minhasParticipacoes[l.desafio_id];
        if (!atual || (l.pontos ?? 0) > (atual.pontos ?? 0)) minhasParticipacoes[l.desafio_id] = l;
        if (l.imagem_url) (minhasFotos[l.desafio_id] = minhasFotos[l.desafio_id] || []).push(l.imagem_url);
      });
    }

    async function carregarPontosEPosicao() {
      const { data, error } = await supabaseClient.rpc('leaderboard');
      if (error) {
        console.error('Erro ao ir buscar o leaderboard:', error.message, error.details, error.hint);
        return;
      }

      const indice = data.findIndex(l => l.participante_id === participanteAtual.id);
      const meuTotal = indice >= 0 ? data[indice].total_pontos : 0;

      document.getElementById('total-pontos').textContent = meuTotal;
      document.getElementById('posicao-leaderboard').textContent =
        indice >= 0 ? `#${indice + 1} de ${data.length}` : '—';
    }

    function renderDesafios() {
      const container = document.getElementById('secao-desafios');
      container.innerHTML = '';

      if (desafios.length === 0) {
        container.innerHTML = '<div class="vazio">Ainda não há missões publicadas.</div>';
        return;
      }

      desafios.forEach(d => {
        const minhaParticipacao = minhasParticipacoes[d.id];
        const card = document.createElement('div');
        card.className = 'card-desafio' + (d.tipo === 'em_breve' ? ' em-breve' : '');

        let corpoInterno = '';

        if (d.tipo === 'em_breve') {
          corpoInterno = `<div class="badge-embreve" style="display:inline-block; margin-top:4px;">Em breve</div>`;
        } else if (d.tipo === 'contactos') {
          if (minhaParticipacao && minhaParticipacao.estado === 'aprovado') {
            corpoInterno = `
              <div class="estado-desafio aprovado">✓ Missão completa — +${minhaParticipacao.pontos} pontos</div>
              <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">Já tens ${contagemContactos} contacto${contagemContactos === 1 ? '' : 's'} recolhidos. Continua a somar — não há limite.</div>
              <a href="contactos.html" style="display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:var(--accent); text-decoration:none;">Adicionar mais contactos →</a>
            `;
          } else {
            corpoInterno = `
              <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Progresso: ${contagemContactos} / 5 contactos</div>
              <a href="contactos.html" class="botao-submeter" style="display:block; text-decoration:none; text-align:center;">Ir adicionar contactos →</a>
            `;
          }
        } else if (d.tipo === 'foto') {
          const fotos = minhasFotos[d.id] || [];
          const publicou = minhaParticipacao && minhaParticipacao.estado === 'aprovado';
          corpoInterno = `
            ${fotos.length ? `<div class="tira-fotos">${fotos.map(u => `<img class="miniatura-enviada" src="${u}" alt="Foto enviada">`).join('')}</div>` : ''}
            ${publicou ? `<div class="estado-desafio aprovado">✓ ${fotos.length} foto${fotos.length === 1 ? '' : 's'} partilhada${fotos.length === 1 ? '' : 's'} — +${minhaParticipacao.pontos} pontos</div>` : ''}
            <div class="form-submissao">
              <input type="text" id="legenda-${d.id}" placeholder="Legenda (opcional)">
              <input type="file" id="foto-${d.id}" accept="image/*" multiple>
              <button class="botao-submeter" id="botao-${d.id}" onclick="submeterFoto('${d.id}')">${publicou ? 'Adicionar mais fotos' : `Partilhar (+${d.pontos} pontos)`}</button>
              <div class="mensagem-desafio" id="mensagem-${d.id}"></div>
            </div>
          `;
        }

        if (d.tipo === 'ideia') {
          const jaPublicou = minhaParticipacao && minhaParticipacao.estado === 'aprovado';
          corpoInterno = `
            ${jaPublicou ? `<div class="estado-desafio aprovado">✓ Ideia partilhada — +${minhaParticipacao.pontos} pontos</div>` : ''}
            <div class="form-submissao">
              <label class="pergunta" for="ideia-${d.id}">O que levas desta palestra?</label>
              <div class="dica-ideia">Escreve uma ideia que queiras partilhar com os outros participantes. Máximo de 30 segundos de leitura.</div>
              <textarea id="ideia-${d.id}" maxlength="${MAX_IDEIA}" placeholder="Uma ideia, uma pergunta que ficou, uma perspetiva que mudou…" oninput="atualizarContadorIdeia('${d.id}')"></textarea>
              <div class="contador-ideia" id="contador-${d.id}">0 / ${MAX_IDEIA}</div>
              <button class="botao-submeter" id="botao-${d.id}" onclick="submeterIdeia('${d.id}')">${jaPublicou ? 'Partilhar outra ideia' : `Partilhar ideia (+${d.pontos} pontos)`}</button>
              <div class="mensagem-desafio" id="mensagem-${d.id}"></div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="cabecalho-desafio">
            <div class="nome">${d.tipo === 'ideia' ? IDEIA_NOME : d.nome}</div>
            ${d.tipo !== 'em_breve' ? `<div class="badge-pontos">${d.pontos} pts</div>` : ''}
          </div>
          <div class="descricao-desafio">${d.tipo === 'ideia' ? IDEIA_DESC_HTML : (d.descricao ?? '')}</div>
          ${corpoInterno}
        `;

        container.appendChild(card);
      });
    }

    async function submeterFoto(desafioId) {
      const inputFoto = document.getElementById(`foto-${desafioId}`);
      const inputLegenda = document.getElementById(`legenda-${desafioId}`);
      const mensagemEl = document.getElementById(`mensagem-${desafioId}`);
      const botao = document.getElementById(`botao-${desafioId}`);

      const ficheiros = [...inputFoto.files];
      if (ficheiros.length === 0) {
        mensagemEl.textContent = 'Escolhe pelo menos uma foto.';
        mensagemEl.className = 'mensagem-desafio erro';
        return;
      }
      if (botao) botao.disabled = true;

      const desafio = desafios.find(d => d.id === desafioId);
      const jaTemPontos = minhasParticipacoes[desafioId]?.estado === 'aprovado';
      let enviadas = 0;

      for (const [i, ficheiro] of ficheiros.entries()) {
        mensagemEl.textContent = `A enviar foto ${i + 1} de ${ficheiros.length}…`;
        mensagemEl.className = 'mensagem-desafio';

        const extensao = ficheiro.name.split('.').pop();
        const caminho = `${participanteAtual.id}-${desafioId}-${Date.now()}-${i}.${extensao}`;

        const { error: erroUpload } = await supabaseClient.storage.from('mural').upload(caminho, ficheiro, { upsert: true });
        if (erroUpload) {
          mensagemEl.textContent = 'Erro ao enviar a foto: ' + erroUpload.message;
          mensagemEl.className = 'mensagem-desafio erro';
          break;
        }

        const { data: urlPublica } = supabaseClient.storage.from('mural').getPublicUrl(caminho);

        // Só a primeira foto do desafio dá pontos; as seguintes entram no mural com 0 pontos.
        const { error: erroInsert } = await supabaseClient.from('gamification').insert({
          participante_id: participanteAtual.id,
          desafio_id: desafioId,
          desafio: desafio?.nome ?? null,
          pontos: (!jaTemPontos && enviadas === 0) ? (desafio?.pontos ?? 0) : 0,
          estado: 'aprovado',
          imagem_url: urlPublica.publicUrl,
          legenda: inputLegenda.value.trim() || null,
          prova_submetida: urlPublica.publicUrl
        });
        if (erroInsert) {
          mensagemEl.textContent = 'Erro ao guardar: ' + erroInsert.message;
          mensagemEl.className = 'mensagem-desafio erro';
          break;
        }
        enviadas++;
      }

      if (botao) botao.disabled = false;
      if (enviadas > 0) {
        await carregarMinhasParticipacoes();
        renderDesafios();
        await carregarPontosEPosicao();
        if (typeof carregarMural === 'function') carregarMural();
      }
    }

    function atualizarContadorIdeia(desafioId) {
      const n = document.getElementById(`ideia-${desafioId}`).value.length;
      const el = document.getElementById(`contador-${desafioId}`);
      el.textContent = `${n} / ${MAX_IDEIA}`;
      el.classList.toggle('cheio', n >= MAX_IDEIA);
    }

    async function submeterIdeia(desafioId) {
      const campo = document.getElementById(`ideia-${desafioId}`);
      const mensagemEl = document.getElementById(`mensagem-${desafioId}`);
      const botao = document.getElementById(`botao-${desafioId}`);
      const texto = campo.value.trim();

      if (texto.length < 10) {
        mensagemEl.textContent = 'Escreve um pouco mais — uma frase já chega.';
        mensagemEl.className = 'mensagem-desafio erro';
        return;
      }
      if (texto.length > MAX_IDEIA) {
        mensagemEl.textContent = `Máximo de ${MAX_IDEIA} caracteres (30 segundos de leitura).`;
        mensagemEl.className = 'mensagem-desafio erro';
        return;
      }

      botao.disabled = true;
      mensagemEl.textContent = 'A partilhar…';
      mensagemEl.className = 'mensagem-desafio';

      const desafio = desafios.find(d => d.id === desafioId);
      const jaTemPontos = minhasParticipacoes[desafioId]?.estado === 'aprovado';

      // Só a primeira ideia dá pontos; as seguintes são partilhadas com 0 pontos.
      const { error } = await supabaseClient.from('gamification').insert({
        participante_id: participanteAtual.id,
        desafio_id: desafioId,
        desafio: IDEIA_NOME,
        pontos: jaTemPontos ? 0 : (desafio?.pontos ?? 0),
        estado: 'aprovado',
        legenda: texto
      });

      botao.disabled = false;
      if (error) {
        mensagemEl.textContent = 'Erro ao partilhar: ' + error.message;
        mensagemEl.className = 'mensagem-desafio erro';
        return;
      }

      await carregarMinhasParticipacoes();
      renderDesafios();
      await carregarPontosEPosicao();
      const novoMsg = document.getElementById(`mensagem-${desafioId}`);
      if (novoMsg) { novoMsg.textContent = 'Ideia partilhada! Podes vê-la no separador One talk, one takeaway.'; novoMsg.className = 'mensagem-desafio sucesso'; }
    }

    async function apagarIdeia(id, botao) {
      if (!confirm('Apagar esta ideia? Se foi a que te deu pontos, perdes esses pontos.')) return;
      botao.disabled = true;
      const { data, error } = await supabaseClient.rpc('apagar_ideia', { p_id: String(id) });
      if (error || data === false) {
        botao.disabled = false;
        alert('Não foi possível apagar a ideia.' + (error ? ' ' + error.message : ''));
        return;
      }
      await carregarMinhasParticipacoes();
      renderDesafios();
      await carregarPontosEPosicao();
      carregarIdeias();
    }

    async function carregarIdeias() {
      const container = document.getElementById('secao-ideias');
      container.innerHTML = '<div class="vazio">A carregar ideias…</div>';

      const { data, error } = await supabaseClient.rpc('ideias_jenc');
      if (error) {
        container.innerHTML = '<div class="vazio">Não foi possível carregar os takeaways.</div>';
        console.error('Erro ao ir buscar as ideias:', error.message, error.details, error.hint);
        return;
      }
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="vazio">Ainda ninguém partilhou um takeaway. Sê o primeiro!</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(i => {
        const card = document.createElement('div');
        card.className = 'card-desafio';
        card.innerHTML = `
          <p class="texto-ideia">${esc(i.ideia)}</p>
          <div class="rodape-ideia">
            <div class="autor-ideia">${esc(i.nome)}${i.junior_empresa ? ` <span>· ${esc(i.junior_empresa)}</span>` : ''}</div>
            ${i.minha ? `<button type="button" class="botao-perigo botao-apagar-ideia">Apagar</button>` : ''}
          </div>
        `;
        const apagar = card.querySelector('.botao-apagar-ideia');
        if (apagar) apagar.addEventListener('click', () => apagarIdeia(i.id, apagar));
        container.appendChild(card);
      });
    }

    async function carregarMural() {
      const grid = document.getElementById('grid-mural');
      const vazio = document.getElementById('mural-vazio');
      grid.innerHTML = '<div class="vazio">A carregar fotos…</div>';

      const { data, error } = await supabaseClient.rpc('mural_fotos');
      if (error) {
        grid.innerHTML = '';
        vazio.style.display = 'block';
        vazio.textContent = 'Não foi possível carregar o Share your JENC.';
        console.error('Erro ao ir buscar o mural:', error.message, error.details, error.hint);
        return;
      }

      grid.innerHTML = '';
      const fotos = (data ?? []).filter(f => f.imagem_url);
      if (fotos.length === 0) {
        vazio.style.display = 'block';
        return;
      }
      vazio.style.display = 'none';

      fotos.forEach(foto => {
        const item = document.createElement('div');
        item.className = 'item-mural';
        item.innerHTML = `
          <img src="${esc(foto.imagem_url)}" alt="Foto de ${esc(foto.nome)}">
          <div class="legenda-mural">
            <div class="nome">${esc(foto.nome)}</div>
            ${foto.legenda ? `<div class="texto">${esc(foto.legenda)}</div>` : ''}
          </div>
        `;
        item.querySelector('img').addEventListener('click', () => abrirLightbox(foto));
        grid.appendChild(item);
      });
    }

    // -----------------------------------------------------------------
    // Visualizador de ecrã inteiro do mural (tocar para ampliar + descarregar)
    // -----------------------------------------------------------------
    function abrirLightbox(foto) {
      document.getElementById('lightbox-img').src = foto.imagem_url;
      document.getElementById('lightbox-nome').textContent = foto.nome ?? '';
      document.getElementById('lightbox-texto').textContent = foto.legenda ?? '';
      const botaoDownload = document.getElementById('lightbox-download');
      botaoDownload.dataset.url = foto.imagem_url;
      botaoDownload.dataset.nome = (foto.nome || 'foto-jenc').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-');
      document.getElementById('lightbox-mural').classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }

    function fecharLightbox() {
      document.getElementById('lightbox-mural').classList.remove('aberto');
      document.getElementById('lightbox-img').src = '';
      document.body.style.overflow = '';
    }

    document.getElementById('lightbox-mural').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox-mural') fecharLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fecharLightbox();
    });

    async function descarregarFotoLightbox() {
      const botao = document.getElementById('lightbox-download');
      const url = botao.dataset.url;
      const nomeFicheiro = (botao.dataset.nome || 'foto-jenc') + '.jpg';
      const textoOriginal = botao.innerHTML;
      botao.innerHTML = 'A preparar…';

      try {
        // Descarrega a imagem como blob para forçar o download (em vez de
        // abrir a imagem numa nova aba), mesmo vindo de outro domínio.
        const resposta = await fetch(url);
        const blob = await resposta.blob();
        const urlTemporario = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = urlTemporario;
        a.download = nomeFicheiro;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(urlTemporario), 4000);
      } catch (e) {
        // Alguns navegadores (ex: Safari em iOS) bloqueiam o download direto —
        // abre a foto numa nova aba para a pessoa guardar com "premir e segurar".
        window.open(url, '_blank');
      } finally {
        botao.innerHTML = textoOriginal;
      }
    }

    async function carregarLeaderboard() {
      const container = document.getElementById('secao-leaderboard');
      container.innerHTML = '<div class="vazio">A carregar o Top navegantes…</div>';

      const { data, error } = await supabaseClient.rpc('leaderboard');
      if (error) {
        container.innerHTML = '<div class="vazio">Não foi possível carregar o Top navegantes.</div>';
        console.error('Erro ao ir buscar o leaderboard:', error.message, error.details, error.hint);
        return;
      }

      container.innerHTML = '';
      data.forEach((linha, indice) => {
        const posicao = indice + 1;
        const souEu = linha.participante_id === participanteAtual.id;
        const item = document.createElement('div');
        item.className = 'linha-leaderboard' + (souEu ? ' eu' : '') + (posicao <= 3 ? ' top' + posicao : '');
        item.innerHTML = `
          <div class="posicao-num">${posicao}</div>
          <div class="info-lb">
            <div class="nome-lb">${esc(linha.nome)}${souEu ? ' (tu)' : ''}</div>
            <div class="junior-lb">${esc(linha.junior_empresa)}</div>
          </div>
          <div class="pontos-lb">${linha.total_pontos}</div>
        `;
        container.appendChild(item);
      });
    }
  </script>
