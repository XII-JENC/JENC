<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  body { padding: 22px 16px 110px; max-width: 480px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--suave); font-size: 13px; margin: 0 0 18px; }

  .abas-pisos { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 12px; scrollbar-width: none; }
  .abas-pisos::-webkit-scrollbar { display: none; }
  .aba-piso { flex-shrink: 0; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .mapa-caixa { position: relative; width: 100%; border-radius: 18px; overflow: hidden; cursor: zoom-in;
    background: rgba(22,55,95,.5); border: 1px solid var(--hairline); box-shadow: 0 8px 24px rgba(0,0,0,.25); min-height: 220px; }
  .mapa-caixa img { display: block; width: 100%; height: auto; }
  .mapa-caixa .aviso { padding: 60px 20px; text-align: center; font-size: 13px; color: var(--suave); }
  .dica { text-align: center; font-size: 12px; color: var(--suave); margin: 10px 0 0; }

  /* Ecrã inteiro: a planta abre maior, com scroll/zoom para ler as salas */
  .ampliado { position: fixed; inset: 0; z-index: 100; background: rgba(12,35,64,.96); overflow: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y pinch-zoom; display: none; }
  .ampliado.aberto { display: block; }
  .ampliado img { display: block; width: 220%; max-width: none; height: auto; margin: 56px 0 40px; }
  .ampliado button { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 101; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--hairline-forte); background: rgba(12,35,64,.95); color: var(--tinta); font: 700 13px Montserrat, sans-serif; cursor: pointer; }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-jenc" aria-hidden="true"></div>
  <div class="fundo-jenc-veu" aria-hidden="true"></div>

  <h1>Mapa do recinto</h1>
  <p class="sub">Escolhe o piso. Toca na planta para ampliar.</p>

  <div id="abas-pisos" class="abas-pisos"></div>
  <div id="mapa-container"></div>
  <p class="dica">Dentro da planta ampliada, arrasta para te deslocares.</p>

  <div class="ampliado" id="ampliado">
    <button type="button" onclick="fecharAmpliado()">Fechar ✕</button>
    <img id="img-ampliada" alt="">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <script>
    // Plantas do ISEG (ficheiros em plantas/). Para trocar uma planta, substitui o ficheiro mantendo o nome.
    const PLANTAS = [
      { chave: 'geral', nome: 'Geral',  ficheiro: 'plantas/geral.png' },
      { chave: '1',     nome: 'Piso 1', ficheiro: 'plantas/piso-1.png' },
      { chave: '2',     nome: 'Piso 2', ficheiro: 'plantas/piso-2.png' },
      { chave: '3',     nome: 'Piso 3', ficheiro: 'plantas/piso-3.png' },
      { chave: '4',     nome: 'Piso 4', ficheiro: 'plantas/piso-4.png' }
    ];
    let atual = PLANTAS[0].chave;

    init();

    async function init() {
      const user = await exigirSessao();
      if (!user) return;
      renderAbas();
      renderMapa();
    }

    function renderAbas() {
      const c = document.getElementById('abas-pisos');
      c.innerHTML = '';
      PLANTAS.forEach(p => {
        const aba = document.createElement('div');
        aba.className = 'aba-piso' + (p.chave === atual ? ' ativa' : '');
        aba.textContent = p.nome;
        aba.onclick = () => { if (p.chave === atual) return; atual = p.chave; renderAbas(); renderMapa(); };
        c.appendChild(aba);
      });
    }

    function renderMapa() {
      const planta = PLANTAS.find(p => p.chave === atual);
      const caixa = document.createElement('div');
      caixa.className = 'mapa-caixa';

      const img = document.createElement('img');
      img.alt = `Planta — ${planta.nome}`;
      img.onerror = () => { caixa.style.cursor = 'default'; caixa.innerHTML = `<div class="aviso">Não foi possível carregar a planta (${planta.ficheiro}).</div>`; };
      img.src = planta.ficheiro;
      caixa.appendChild(img);
      caixa.onclick = () => abrirAmpliado(planta);

      const container = document.getElementById('mapa-container');
      container.innerHTML = '';
      container.appendChild(caixa);
    }

    function abrirAmpliado(planta) {
      const img = document.getElementById('img-ampliada');
      img.src = planta.ficheiro; img.alt = `Planta — ${planta.nome}`;
      const box = document.getElementById('ampliado');
      box.classList.add('aberto'); box.scrollTo(0, 0);
      document.body.style.overflow = 'hidden';
    }
    function fecharAmpliado() {
      document.getElementById('ampliado').classList.remove('aberto');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharAmpliado(); });
  </script>

  <script src="jenc-ui.js"></script>
</body>
</html>
