<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  body { padding: 22px 14px 110px; max-width: 480px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-jenc" aria-hidden="true"></div>
  <div class="fundo-jenc-veu" aria-hidden="true"></div>

  <h1>Agenda</h1>

  <div class="abas-dias" id="abas-dias"></div>
  <div id="area-calendario"></div>
  <div class="carregamento-agenda" id="carregamento">A carregar agenda…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="jenc-agenda.js"></script>
  <script>
    (async () => {
      const c = document.getElementById('carregamento');
      try {
        const user = await exigirSessao();
        if (!user) return;
        if (typeof JencAgenda === 'undefined') { c.textContent = 'Erro: o ficheiro jenc-agenda.js não foi encontrado (tem de estar na mesma pasta que agenda.html).'; return; }
        JencAgenda.montar();
      } catch (e) { console.error(e); c.textContent = 'Erro: ' + e.message; }
    })();
  </script>

  <script src="jenc-ui.js"></script>
</body>
</html>
