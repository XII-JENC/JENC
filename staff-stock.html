<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jenc-tema.css">
<style>
  :root {
    --bg: #0C2340;
    --card: rgba(22, 55, 95, 0.46);
    --accent: #BD8C1C;
    --text: #F6F1E4;
    --muted: #93A6BF;
    --border: rgba(189, 140, 28, 0.24);
    --sucesso: #8FCB9B;
    --erro: #E8877A;
  }
  * { box-sizing: border-box; }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, [class*="campo"], input, .rotulo-funcao {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.015em; }
  body {
    margin: 0;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 18px 110px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .nav-staff { display: flex; gap: 8px; }
  .nav-staff a, .nav-staff button {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:14px; padding:6px 10px; border-radius:8px; cursor:pointer; text-decoration:none;
  }

  /* Espaçamento generoso: cada bloco tem ar à volta e entre si */
  header { margin-bottom: 26px; }
  .mensagem-topo { margin-bottom: 14px; }

  .botao-novo-momento {
    width: 100%; padding: 15px; border-radius: 999px; border: 1px dashed var(--border);
    background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
    margin-bottom: 26px;
  }

  .form-momento, .form-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 26px; display: none;
  }
  .form-item { margin: 18px 0 0; padding: 18px; background: rgba(12,35,64,.4); }
  .form-momento.aberto, .form-item.aberto { display: block; }
  .form-momento input, .form-item input {
    width: 100%; padding: 13px 14px; border-radius: 12px; margin-bottom: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px;
  }
  .linha-form { display: flex; gap: 12px; }
  .linha-form input { flex: 1; min-width: 0; }
  .form-momento .linha-form:last-child, .form-item .linha-form:last-child { margin-top: 6px; }
  .botao-guardar {
    padding: 12px 22px; border: none; border-radius: 999px;
    background: var(--accent); color: #0C2340; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .botao-cancelar {
    padding: 12px 22px; border: 1px solid var(--border); border-radius: 999px;
    background: none; color: var(--muted); font-size: 13px; cursor: pointer;
  }

  .card-momento {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 20px; margin-bottom: 28px;
  }
  .cabecalho-momento { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .cabecalho-momento .nome { font-size: 17px; font-weight: 700; }
  .cabecalho-momento .detalhe { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* Cada item é uma caixa própria, separada das outras */
  .item-stock { background: rgba(12,35,64,.38); border: 1px solid rgba(189,140,28,.18); border-radius: 14px; padding: 18px 16px; margin-bottom: 14px; }
  .item-stock .topo-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .item-stock .nome-item { font-size: 15px; font-weight: 600; }
  .item-stock .contagem-item { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .barra-progresso { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-bottom: 18px; }
  .barra-progresso .preenchido { height: 100%; background: var(--accent); }
  .barra-progresso .preenchido.esgotado { background: var(--erro); }

  .linha-passos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .botao-passo {
    min-height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .linha-exato { display: flex; align-items: center; gap: 10px; }
  .linha-exato .rotulo-mini { font-size: 12px; color: var(--muted); }
  .linha-exato .separador { flex: 1; }
  .controlos-item input.campo-numero, .linha-exato input.campo-numero {
    width: 72px; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; text-align: center;
  }
  .linha-exato .botao-passo { min-height: 42px; width: 46px; }

  .corrigir-inicial { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .corrigir-inicial .ligacao { cursor: pointer; text-decoration: underline; }
  .corrigir-inicial .editar { display: none; align-items: center; gap: 10px; margin-top: 12px; }
  .corrigir-inicial .editar.aberto { display: flex; }

  .botao-add-item {
    width: 100%; padding: 13px; border-radius: 999px; border: 1px dashed var(--border);
    background: none; color: var(--muted); font-size: 13px; cursor: pointer; margin-top: 8px;
  }

  .vazio, .estado-carregamento { text-align: center; color: var(--muted); padding: 34px 0; font-size: 14px; }
  .mensagem-topo { font-size: 12px; text-align: center; margin-bottom: 10px; min-height: 16px; }
  .mensagem-topo.erro { color: var(--erro); }
</style>
<link rel="stylesheet" href="jenc-estilo.css">
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Stock</h1>
      <p class="sub">Coffee breaks, almoço e jantar.</p>
    </div>
    <div class="nav-staff">
      <a href="staff-inicio.html" title="Início"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></a>
      <button onclick="terminarSessaoStaff()">Sair</button>
    </div>
  </header>

  <div class="mensagem-topo" id="mensagem-topo"></div>

  <button class="botao-novo-momento" onclick="alternarFormMomento()">+ Novo momento (coffee break / almoço / jantar)</button>

  <div class="form-momento" id="form-momento">
    <input type="text" id="fm-nome" placeholder="Nome (ex: Coffee Break Manhã)">
    <div class="linha-form">
      <input type="date" id="fm-data">
      <input type="text" id="fm-local" placeholder="Local (ex: Hall central)">
    </div>
    <div class="linha-form">
      <input type="time" id="fm-hora-inicio">
      <input type="time" id="fm-hora-fim">
    </div>
    <div class="linha-form">
      <button class="botao-guardar" onclick="criarMomento()">Criar momento</button>
      <button class="botao-cancelar" onclick="alternarFormMomento()">Cancelar</button>
    </div>
  </div>

  <div id="lista-momentos"></div>

  <div class="estado-carregamento" id="carregamento">A carregar stock…</div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    let momentos = [];
    let itensPorMomento = {};
    let intervaloAtualizacao = null;

    init();

    async function init() {
      const user = await exigirSessaoStaff();
      if (!user) return;

      const staff = await getStaffAtual(user);
      if (!staff) {
        document.getElementById('carregamento').textContent = 'Conta sem acesso de staff.';
        return;
      }

      await carregarTudo();
      document.getElementById('carregamento').style.display = 'none';

      // Atualiza sozinho de vez em quando, para veres o que outros
      // membros do staff forem registando, sem teres de dar refresh.
      intervaloAtualizacao = setInterval(() => { if (!aEditar()) carregarTudo(); }, 20000);
    }

    // Não recarrega a lista enquanto estás a escrever ou com um formulário aberto (senão perdias o que escreveste).
    function aEditar() {
      const ativo = document.activeElement;
      const aEscrever = ativo && ativo.tagName === 'INPUT';
      return aEscrever || !!document.querySelector('.form-item.aberto, .form-momento.aberto, .corrigir-inicial .editar.aberto');
    }

    async function carregarTudo() {
      momentos = await getMomentos();
      const itens = await getItens();

      itensPorMomento = {};
      itens.forEach(i => {
        if (!itensPorMomento[i.momento_id]) itensPorMomento[i.momento_id] = [];
        itensPorMomento[i.momento_id].push(i);
      });

      renderMomentos();
    }

    async function getMomentos() {
      const { data, error } = await supabaseClient
        .from('momentos_stock')
        .select('id, nome, data, hora_inicio, hora_fim, local')
        .order('data', { ascending: true })
        .order('hora_inicio', { ascending: true });

      if (error) {
        console.error('Erro ao ir buscar momentos:', error.message, error.details, error.hint);
        return [];
      }
      return data ?? [];
    }

    async function getItens() {
      const { data, error } = await supabaseClient
        .from('itens_stock')
        .select('id, momento_id, nome, quantidade_inicial, quantidade_restante')
        .order('nome', { ascending: true });

      if (error) {
        console.error('Erro ao ir buscar itens de stock:', error.message, error.details, error.hint);
        return [];
      }
      return data ?? [];
    }

    function alternarFormMomento() {
      document.getElementById('form-momento').classList.toggle('aberto');
    }

    async function criarMomento() {
      const nome = document.getElementById('fm-nome').value.trim();
      if (!nome) {
        mostrarMensagemTopo('Dá um nome ao momento (ex: "Coffee Break Manhã").', 'erro');
        return;
      }

      const { error } = await supabaseClient.from('momentos_stock').insert({
        nome,
        data: document.getElementById('fm-data').value || null,
        hora_inicio: document.getElementById('fm-hora-inicio').value || null,
        hora_fim: document.getElementById('fm-hora-fim').value || null,
        local: document.getElementById('fm-local').value.trim() || null
      });

      if (error) {
        mostrarMensagemTopo('Erro ao criar momento: ' + error.message, 'erro');
        return;
      }

      document.getElementById('fm-nome').value = '';
      document.getElementById('fm-local').value = '';
      document.getElementById('fm-data').value = '';
      document.getElementById('fm-hora-inicio').value = '';
      document.getElementById('fm-hora-fim').value = '';
      alternarFormMomento();
      await carregarTudo();
    }

    function formatarCabecalhoMomento(m) {
      const partes = [];
      if (m.data) {
        const d = new Date(m.data + 'T00:00:00');
        partes.push(d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' }));
      }
      if (m.hora_inicio) partes.push(`${m.hora_inicio.slice(0,5)}${m.hora_fim ? ' – ' + m.hora_fim.slice(0,5) : ''}`);
      if (m.local) partes.push(`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.3" r="2.3"/></svg> ${m.local}`);
      return partes.join(' · ');
    }

    function renderMomentos() {
      const container = document.getElementById('lista-momentos');
      container.innerHTML = '';

      if (momentos.length === 0) {
        container.innerHTML = '<div class="vazio">Ainda não há nenhum momento criado. Usa o botão acima para criares o primeiro.</div>';
        return;
      }

      momentos.forEach(m => {
        const itens = itensPorMomento[m.id] ?? [];

        const card = document.createElement('div');
        card.className = 'card-momento';

        const cabecalho = document.createElement('div');
        cabecalho.className = 'cabecalho-momento';
        cabecalho.innerHTML = `
          <div class="nome">${m.nome}</div>
          <div class="detalhe">${formatarCabecalhoMomento(m) || 'Sem data/hora/local definidos'}</div>
        `;
        card.appendChild(cabecalho);

        if (itens.length === 0) {
          const vazio = document.createElement('div');
          vazio.className = 'vazio';
          vazio.style.padding = '8px 0 16px';
          vazio.textContent = 'Ainda sem itens de stock.';
          card.appendChild(vazio);
        }

        itens.forEach(item => card.appendChild(renderItem(item)));

        const botaoAddItem = document.createElement('button');
        botaoAddItem.className = 'botao-add-item';
        botaoAddItem.textContent = '+ Adicionar item';
        botaoAddItem.onclick = () => alternarFormItem(m.id);
        card.appendChild(botaoAddItem);

        const formItem = document.createElement('div');
        formItem.className = 'form-item';
        formItem.id = `form-item-${m.id}`;
        formItem.innerHTML = `
          <input type="text" id="fi-nome-${m.id}" placeholder="Nome do item (ex: Café)">
          <input type="text" inputmode="numeric" id="fi-quantidade-${m.id}" placeholder="Quantidade inicial" min="0">
          <div class="linha-form">
            <button class="botao-guardar" onclick="criarItem('${m.id}')">Adicionar</button>
            <button class="botao-cancelar" onclick="alternarFormItem('${m.id}')">Cancelar</button>
          </div>
        `;
        card.appendChild(formItem);

        container.appendChild(card);
      });
    }

    function renderItem(item) {
      const percentagemConsumida = item.quantidade_inicial > 0
        ? Math.min(100, Math.round(((item.quantidade_inicial - item.quantidade_restante) / item.quantidade_inicial) * 100))
        : 0;

      const div = document.createElement('div');
      div.className = 'item-stock';
      div.innerHTML = `
        <div class="topo-item">
          <div class="nome-item">${item.nome}</div>
          <div class="contagem-item">restam <strong id="valor-restante-${item.id}">${item.quantidade_restante}</strong> de ${item.quantidade_inicial}</div>
        </div>
        <div class="barra-progresso">
          <div class="preenchido${item.quantidade_restante === 0 ? ' esgotado' : ''}" style="width:${percentagemConsumida}%"></div>
        </div>
        <div class="controlos-item">
          <div class="linha-passos">
            <button class="botao-passo" onclick="ajustarRestante('${item.id}', -1)">-1</button>
            <button class="botao-passo" onclick="ajustarRestante('${item.id}', -5)">-5</button>
            <button class="botao-passo" onclick="ajustarRestante('${item.id}', -10)">-10</button>
            <button class="botao-passo" onclick="ajustarRestante('${item.id}', -25)">-25</button>
          </div>
          <div class="linha-exato">
            <span class="rotulo-mini">Restam:</span>
            <input type="text" inputmode="numeric" class="campo-numero" min="0" value="${item.quantidade_restante}" id="restante-${item.id}"
                   onkeydown="if(event.key==='Enter') guardarRestante('${item.id}')">
            <button class="botao-passo" onclick="guardarRestante('${item.id}')" aria-label="Guardar">✓</button>
          </div>
        </div>
        <div class="corrigir-inicial">
          <span class="ligacao" onclick="alternarEditarInicial('${item.id}')">Corrigir quantidade inicial</span>
          <div class="editar" id="editar-inicial-${item.id}">
            <input type="text" inputmode="numeric" class="campo-numero" min="0" value="${item.quantidade_inicial}" id="inicial-${item.id}"
                   onkeydown="if(event.key==='Enter') guardarInicial('${item.id}')">
            <button class="botao-passo" onclick="guardarInicial('${item.id}')" aria-label="Guardar">✓</button>
          </div>
        </div>
      `;
      return div;
    }

    function alternarFormItem(momentoId) {
      document.getElementById(`form-item-${momentoId}`).classList.toggle('aberto');
    }

    async function criarItem(momentoId) {
      const nome = document.getElementById(`fi-nome-${momentoId}`).value.trim();
      const quantidade = parseFloat(document.getElementById(`fi-quantidade-${momentoId}`).value) || 0;

      if (!nome) {
        mostrarMensagemTopo('Dá um nome ao item (ex: "Café").', 'erro');
        return;
      }

      const { error } = await supabaseClient.from('itens_stock').insert({
        momento_id: momentoId,
        nome,
        quantidade_inicial: quantidade,
        quantidade_restante: quantidade
      });

      if (error) {
        mostrarMensagemTopo('Erro ao adicionar item: ' + error.message, 'erro');
        return;
      }

      await carregarTudo();
    }

    async function ajustarRestante(itemId, delta) {
      const { error } = await supabaseClient.rpc('ajustar_restante', { item_id: itemId, delta });
      if (error) {
        mostrarMensagemTopo('Erro ao atualizar: ' + error.message, 'erro');
        return;
      }
      await carregarTudo();
    }

    async function guardarRestante(itemId) {
      const novoValor = parseFloat(document.getElementById(`restante-${itemId}`).value);
      if (isNaN(novoValor) || novoValor < 0) {
        mostrarMensagemTopo('Escreve um número válido.', 'erro');
        return;
      }

      const { error } = await supabaseClient
        .from('itens_stock')
        .update({ quantidade_restante: novoValor, atualizado_em: new Date().toISOString() })
        .eq('id', itemId);

      if (error) {
        mostrarMensagemTopo('Erro ao atualizar: ' + error.message, 'erro');
        return;
      }
      await carregarTudo();
    }

    function alternarEditarInicial(itemId) {
      document.getElementById(`editar-inicial-${itemId}`).classList.toggle('aberto');
    }

    async function guardarInicial(itemId) {
      const novoValor = parseFloat(document.getElementById(`inicial-${itemId}`).value);
      if (isNaN(novoValor) || novoValor < 0) {
        mostrarMensagemTopo('Escreve um número válido.', 'erro');
        return;
      }

      const { error } = await supabaseClient
        .from('itens_stock')
        .update({ quantidade_inicial: novoValor, atualizado_em: new Date().toISOString() })
        .eq('id', itemId);

      if (error) {
        mostrarMensagemTopo('Erro ao atualizar: ' + error.message, 'erro');
        return;
      }
      await carregarTudo();
    }

    function mostrarMensagemTopo(texto, tipo) {
      const el = document.getElementById('mensagem-topo');
      el.textContent = texto;
      el.className = 'mensagem-topo' + (tipo ? ' ' + tipo : '');
      setTimeout(() => { el.textContent = ''; }, 4000);
    }

    async function terminarSessaoStaff() {
      if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

  <script src="jenc-ui.js"></script>

</body>
</html>
